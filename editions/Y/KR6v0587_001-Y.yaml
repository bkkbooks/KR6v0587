異性何名相續謂因果性三世諸行何名差別謂有無間生果功能卷四謂業為先後色心起中無間斷名為相續即此相續後後剎那異前前生名為轉變即此轉變於最後時有勝功能無間生果勝餘轉變故名差別卷三順正理論卷五一大同論主的意見我們只要回憶譬喻者建立種子相續生果的思想就可以明白有人專在潛能的見解上去解說反而難得明了不論是後色心起或是因果性三世諸行都是說那顯而易見的所依相續像根芽莖的相續一樣這相續的色心從前前引生所以是果它能引生後後所以是因前後遷流所以叫諸行這遷流是剎那剎那中間沒有間距的所以叫相續這相續的諸行後後的不同前前像莖不同芽花又不同莖順正理論卷三四的由此於後自相續中有分位別異相法起說得再明白不過我們要注意所依的相續不是一味的有種種的差別這叫相續的轉變轉變到最後有無間生果的功能現起像臨命終時現起明了的或重或近起或數習的熏習這無間生果的功能非常強盛比以前潛伏不同所以叫差別差別依真諦譯有殊勝的意義就是論上說的功力勝前的勝功能功能從前心引起以來在相續展轉的所依中潛流到最後才顯現出來這已到感果的前一念了鄰近功能的鄰近是快要鄰近生果的階段相續轉變差別與鄰近應該這樣解說相續轉變的所依本是功能性潛渡的連索所依既然相續轉變潛流的功能也在相續轉變這是可以不言而喻的不過先軌範師的思所熏習微細相續漸漸轉變差別而生已經是專依種子而解說的了四受熏與所依能為因性的功能是熏習所成的在所依的相續轉變中潛流的這自然要討論到受熏與所依無性攝大乘論釋卷二說若言依止種類句義六種轉識或二剎那同一識類或剎那類無有差別由異品故或即彼識或彼剎那有相熏習且有爾所熏習異計或說六識展轉相熏或說前念熏於後念或說熏識剎那種類成唯識論卷三所遮破的受熏異計很多六識受熏五蘊受熏色不相應受熏心所受熏識類受熏識事識類前後受互熏單拿經部來說成唯識論演祕卷三就說有四計經部師計總有四類一本經部許內六根是所熏性二六識展轉而互相熏三前念熏後四類受熏成唯識論演祕所說的就是在無性三說上再加一個六處受熏現在先從無性的三說說起這三說都是建立在六識受熏上的第一六識展轉相熏成唯識論演祕雖說它是經部的見解但經部是不許六識俱時的無性把三差別相違解說為同時受熏根本還成問題第二前念熏習後念是譬喻宗的本義它不許有俱時因果俱有就不能相熏與唯識瑜伽派不同那麼前念熏習後念是它必然的主張第三是熏識剎那種類這又有識類與剎那類二計識類依前人的見解是在前識後識之上假立一一味無別的類性前心後心不同時怎能成為熏習所以建立一貫通前後的假類是同類所以就不妨受熏無性的三說在無性護法的時代經部師或許有這許多異見但在無著世親論師時這只是同一的六識受熏無性的三說是依攝大乘論的一頌而來攝大乘論卷上說六識無相應三差別相違二念不俱有類例餘成失無著論師的本義我們當然不能穿鑿但依世親論師的解說還可以明白世親攝大乘論釋卷二說六識無相應者謂彼諸識有動轉故三差別相違者謂彼諸識別別所依別別所緣別別作意復有餘義別別行相一一轉故譬喻論師欲令前念熏於後念為遮彼故說言二念不得俱有無二剎那一時而有俱生俱滅熏習住故若謂此識種類如是雖不相應然同識類亦得相熏如是例餘應成過失識亦應爾雖同識法何得相熏攝大乘論敘述了種子六義所熏四義證實了唯有阿賴耶識才是受熏者接著說六識無相應一頌遮破六識的不能受熏六識無相應攝大乘論釋解說做謂彼諸識有動轉故意思說六識是忽有忽無忽善忽惡的欠缺了四義中的堅義所以不能受熏三差別相違世親攝大乘論釋並沒有說它破同時展轉相熏不過從六識的所依根所緣境作意三種差別說明六識間彼此相違相違所以不能成為受熏者這不但不是說因三差別相違而不能俱時受熏也不是說因相違而前識不能熏後識依攝大乘論的意思不論是所依所緣作意或者行相都要一味相續的才有受熏持種的能力這只有賴耶六識在相續中忽而眼識忽而耳識根境作意都不是一味的彼此相乖這怎能成為受熏者呢成唯識論的根境作意善等類別易脫起故就是這個思想但無性見了下文的前後相熏望文生義的說若六轉識定俱有者不應所依所緣作意三種各別以各別故六種轉識不定俱生不俱生故無定相應無相應故何有所熏能熏之性他從六識根境作意差別的理由證明六識不一定俱有既不定俱有就沒有相應的意義因此也不成能熏所熏了窺基不滿意他的見解所以有第八六識根等許別行相亦異又無同喻非極成因所以他又提出今解但遮六識體非受熏非識恒起故無熏習不同無性這是窺基的卓見但它卻把世親無性的意見同樣看待不知世親論師根本沒有這樣的見解假使參考有部對經部熏習說的批評這三差別相違的本義更會明白些順正理論卷五一經部師建立它的且業為先心後續起眾賢也用以業與心有差別故與從前業後心的體類因三種差別來攻訐並沒有破它的俱時而有這雖是旁證也可以知道不是難它的俱有相熏了六識無相應三差別相違是總破六識不能受熏不論那一派只要主張六識受熏就在所破之內二念不俱有才別破經部譬喻師理由很簡單前後不能同時有就沒有能熏所熏的熏習義不過經部師是不承認被破的類例餘成失的類在譬喻者的本意只是一種解說它以為前識後識同是識唯其同是識類所以雖有前後還是可以相熏它以類說明前念熏後念的可能並不是與前念熏後不同而另成一派我們看看順正理論對這個問題的討論卷一八中眾賢難破上座的後念六處受熏說是若此後時相續六處能感果者與前念業煩惱都不相應如何熏彼可成隨界這正是從它的前後不俱難它不能受熏上座的解說是豈不因果得有相應與彼相同令成緣故它的相同就是攝大乘論的類與然同識類亦得相熏眾賢的批評先解說相同的意義是此相與彼相同然後用與彼後時相續六處性類各別與彼相亦無何有相同的理由來破它並沒有把它的相同看成一個抽象而別體的東西上座用相同來解說也沒有分為兩派我們轉回來看世親論師的見解它的若謂此識種類如是雖不相應然同識類亦得相熏也只是說前識後識同是識彼此是同類所以不妨受熏世親論師也不過難它色根與色根是同類也應該相熏結論還是雖然同樣是識法又如何可以相熏依舊免不了二念不俱的過失後人解說做另一派說它建立了類性為受熏者這類性還有什麼識類與剎那類受熏還有什麼識熏類類熏識類熏類經部師的熏習成為四計五計或者還不止事實上經部師的受熏與種子的所依只有三大派一六識受熏二六處受熏三細心受熏在種子說的成立裡引證中論順正理論都可以證明譬喻者的本義受熏與種子的所依是建立在心心所上的它主張離思無異熟因離受無異熟果異熟因果是心法那它的業種相續說以心為受熏及業所引起的因性的所依是當然的順正理論卷三四也說它的內法相續謂前後心恒無間斷同時它又是有心無所論者心心相續就等於心心所法相續所以青目說它初心起罪福餘心心數法相續生這個思想在俱舍論順正理論時代還在流行在俱舍論與順正理論中凡是上座與世親論師的色心相續在眾賢引述的時候總是把它改為心心相續俱舍論卷四一再說所依身謂名與色何名相續謂因果性三世諸行這都不是偏於心法的但順正理論卷一二雖也在說名色者何謂即五蘊但又假作世親論師的口吻說天愛非汝解種子性前心俱生思差別故後心功能差別而起它立刻把種子從五蘊轉到心法上它在批評上座的隨界時上座明說是業煩惱所熏六處但一轉也就轉到如何可執言一心具有種種界熏習最明白的像謂業為先後色心起中無間斷名為相續俱舍論卷三經主於此作如是言業相續者謂業為先後後剎那心相續起順正理論卷五一經主於此作如是言思業為先後後心生說名相續順正理論卷三五這把色心轉變為心心決不是偶然的失誤心心相續受熏是譬喻者的本義當時還流行所以眾賢總是把色心轉到心心上去上座主張六處受熏上面已一再說過俱舍論主繼承先軌範師的見解也說名色或根身及心受熏這六處受熏的思想是後起的上座還保持滅定有心的傳統思想先軌範師已接受有部的無色界無色無心定無心的見地因之它比上座它們離譬喻者的本義更遠了上座好像已放棄譬喻者無色界有色的思想那無色界中的有情一切種子只是隨逐意處它的六處受熏及作所依說並不能徹底先軌範師更放棄了無心定有心的見解那它的六處受熏是更難了於是乎它想出了色心互為種子說像俱舍論卷五說故彼先代諸軌範師咸言二法互為種子二法者謂心有根身大乘成業論也說有作是說依附色根種子力故後心還起以能生心心所種子依二相續謂心相續色根相續敘述得更為詳細的像瑜伽師地論卷五一說云何因緣謂諸色根根依及識此二略說能持一切諸法種子隨逐色根有諸色根種子及餘色法種子一切心心所等種子若隨逐識有一切識種子及餘無色法種子諸色根種子所餘色法種子瑜伽師地論略纂說這是隨順理門經部師義它建立了一切種子隨逐色根及心的思想在平時當然是六處受熏持種在無色界與無心定也不妨五色處與意處受熏及作種子的所依不致於再有種子無依之感了世親論師在大乘成業論裡接受一類經為量者的見解放棄了色心互持種子說倡導細心相續作為受熏及所依處這一類經量達到了大小的交界點瑜伽派的唯識學也是從這個思想體系下出來的先軌範師的無色界無色無心定無心是經部而有部化的像俱舍論大家都說它取經部義以補有部的不足在另一觀點上看這是經部的毘曇化從以經為量走上法門分別的毘曇門在這個基礎上再接受大眾分別說系的細心說就到了一類經量者的階段五新熏與本有種子從何而來經部的本義是熏習而成的上座與俱舍論主都這樣說在這個見解上習氣與種子沒有多大分別不過種子是說它的生果功能性習氣熏習是說從它引發而來但一類經量的見解就不同像大乘成業論說即前所說異熟果識攝藏種種諸法種子彼彼餘識及俱有法善不善性數熏發時隨其所應種力增盛由此相續轉變差別隨種力熟隨遇助緣便感當來愛非愛果依如是義有說頌言心與無邊種俱相續恒流遇各別熏緣心種便增盛種力漸次熟緣合時與果如染拘櫞花果時瓤色赤熏並不是熏成種子是熏發種子使它的力量強化心中攝藏的種子經過六識及俱有法或善或惡的熏發它就力量增盛起來強盛到快要成熟時再加以現緣的助力就會感果這是很明白的種子本有論依它種子等於唯識學上的等流因熏發是異熟因可以說一切種子是本有的業力熏發是始有的瑜伽師地論本地分的思想正是這樣一類經量的種子本有論就是經部的毘曇化依有部的見解一切法未來世中早已存在因緣只是引發它來現在這種子本有論者也想像一切法的種子早已存在在相續中潛流不過有部的未來法從現在流入過去以後再不能轉到現在這種子本有論種子生果以後還是存在在現在遇到熏發它還可以生果這只是三世有與二世無的不同罷了在此經部有部融合的基礎上接受大乘思想從小有到大有漸漸的發展起來在西元五六世紀幾乎成為大乘佛教的領導者這不能不使人驚嘆它的偉大了六種子的起滅起滅不是說剎那生滅是說功能的發生與消失譬喻者的種子說本出發於業力熏習說處處說善不善性的熏發引起後後的異熟果這善惡的種子由善惡熏習而來像順正理論卷一二說此中意說不善心中由善所引展轉鄰近功能差別以為種子從此無間善法得生善心中不善所引展轉鄰近功能差別以為種子從此無間不善法生善不善種是由善不善所引起的它能引生善不善果無記種是否是無記所引的功能呢依經部師善惡業感異熟果的見解主張善不善為因緣而生無記這善不善所引的功能既能引生自果又能生無記這都是因緣也是異熟因果眾賢曾這樣的詰問它若上座許唯自相續生起決定得為因緣云何復許善不善法為因緣生無記異熟非善不善隨界為因可生無記相續異故順正理論雖說若言無記熏善不善故善不善為無記因但這是否上座的意見還是眾賢的假敘也不能判明就是善不善思所引起的功能可為生起無記的因緣但無記色法又從何種功能生起呢這是相當困難的這只有兩條路可走一改造有部的思想承認三性諸法種子的本有與業力熏發而感異熟果二擴大熏習的界限不單是善惡思心所能熏後代的唯識學者都曾走過這兩條路或者還折衷過但到極盡思辨的護法唯識還不免有困難存在論到它的消失俱舍論卷三有這樣的話於此義中有差別者異熟因所引與異熟果功能與異熟果已即便謝滅同類因所引與等流果功能若染污者對治起時即便謝滅不染污者般涅槃時方永謝滅這已許可一切諸法的種子都由熏習而來它的異熟因感果就消失等流因要到對治或涅槃這和攝論的有受盡相無受盡相相同它是擴大熏習的範圍了七種子的微妙種子是能生諸法的功能它是存在的有作用的它在五蘊中屬於那一蘊呢隨眠攝識不失法增長無作業這些具有種子意味的東西一般都把它歸納在心不相應的行蘊裡經部學者覺得不大妥當於是乎上座說見順正理論卷四五隨眠以何為體若彼隨眠以彼為體是隨彼法功能性故或此通用四蘊為體功能隨逐心心所故此相應性亦不相應他說隨眠的自體就是欲貪等就是心心所所以是相應的但並沒有心心所的作用所以又不相應俱舍論主的見解多少不同些俱舍論卷一九說然隨眠體非心相應非不相應無別物故煩惱睡位說名隨眠於覺位中即名纏故這只是言語的變化其實還是一個意思種子與所依相續是沒有別體的可也不能說完全相同這叫不一不異像順正理論說功能差別種子與彼善不善心為有別體為無別體此無別體卷一二於後心中前心差別所引習氣此不可說異於後心卷一四瑜伽師地論卷五二隨順經部的思想說得更為明白非析諸行因果性三世諸行別有實物名為種子亦非餘處然即諸行如是種性如是等生如是安布名為種子亦名為果這到賴耶攝藏諸法種子的思想裡就成為賴耶與種子的不一異了薩婆多部只許法體與作用的非一非異卻不能同情經部的見解它要從假實的觀點來批評非舊隨界可說猶如補特伽羅瓶等假有亦非實有如色等法是故不應執此為有它還可以從總別的見地來攻難若言是總種體應假假為實因不應正理若言是別如何可執無記色種為善不善諸法生因假使說種子在一心中那就要問又於一念一心體中無有細分如何能牽愛及非愛俱相違果或者說一心具有種種界熏習一心多界理不成故這當然是有部學者的意見種子論者老實可以斥責它的不懂得微妙不知道這邊看不妨是無記是一味那邊看又不妨是善惡是種種它無別物不妨說假有它有作用不妨說是實有總之種子是非常微妙的微妙一切問題都得到圓滿解決種子論者雖懂得這巧妙的解說但它思想的本質總覺得要有些實在才有作用它建立自己的種子論可以微妙解決但對於別人卻未便如此籠統俱舍論主對犢子系的不可說我非要它說出個究竟到底是假是實護法也要責問識類你到底是假是實是善惡還是無記在我看來微妙的也就是困難的在思想上覺得非有些實在性不可的學者它們的困難可說無法解除除非它困難慣了不再覺得它自己的困難假使不理解這點那你就不能理會中論破斥種子的頌文若如汝分別其過則甚多是故汝所說於義則不然第五節無漏種子第一項有部的解說一切法從因緣生無漏聖道自也不能例外無漏要見道或得正性決定才能現起以前的凡夫身中有沒有生它的功能性呢這就觸及無漏種子問題有部的見解因緣生並不是說新生某一法體不過從緣使法體生起作用見道以前還沒有無漏現行過所以初念的無漏法是沒有同類因的但它還有俱有因相應因所以就是初剎那的無漏法也是有因緣的這樣的因緣論與種子無關種子是親生自果的功能在有部的思想上可說沒有這個東西但有部未來中的一切法本是從現在而推論到未生前的存在它雖沒有像過未無體論者把這現起前的存在攝屬在現在把它看作潛在的流行但也確是本有種子的另一姿態所以從有部流出的經量本計與經部反流與有部合化的思想都會表現出無漏種子本有的見解來第二項經部的解說一說轉的聖法初從有部流出的經部就是說轉部它是有本有無漏種子思想的異部宗輪論說異生位中亦有聖法這聖法窺基解說做即無漏種法爾成就在凡夫身中的聖法當然不會生起現行必然是潛在的被隱覆的不論它的名稱如何意義如何它有無漏種子的性能這是不會錯的二經部的淨界與無漏種從順正理論去看後期的經部師主張無漏種子本有但這無漏種子的本身卻是有漏的譬喻者不許有同時因果的俱有因因此有部不立本有無漏種還可以說有因緣經部不立本有無漏種就有無漏無因的困難了順正理論卷一五批評經部的不立俱有因時就談到它的淨界本有淨界是本有的但要相續轉變有其它的助緣才能生起無漏眾賢的難問雖也說若是無漏若言故少但只是雙關徵詰不是譬喻者承認淨界本是無漏的順正理論卷六八說然彼論說此心心所雖為無漏種而體非無漏猶如木等非火等性謂如世間木為火種地為金種而不可說木是火性地是金性如是異生心及心所雖是無漏種而體非無漏又彼部論言鑽前無熱故謂所鑽木未被鑽時熱猶未有故知木內未被鑽位無火極微許無漏法用有漏法為能生因於教及理俱無違害我們要知道佛法內有兩個思想一一法的生起雖需要種種的條件但它不是假合的有它的自性在它未生以前已經具體而微的存在假使沒有這自性親因雖有其它的助緣也不能生起二認為某一法的生起需要種種的因緣離因緣即失其存在因緣有親有疏但親疏只是必要與不必要的問題就是主要條件也不必是一個這兩個思想對立著經部雖不是徹底的但它的本有無漏種子是屬於後一系的有漏無漏在有部看來是劃然兩截的說有漏心心所法可以作為無漏的能生因當然不能同意經部師覺得因中不必有果有漏位上不必有無漏的無漏種子像木中不必有火極微一樣因緣和合時就可以從有漏的心心所生起無漏但經部的思想不能說沒有困難它是新熏論者承認有漏種子是有漏善惡所引起的能為因性無漏種子卻不是無漏所引起的功能在它的種子定義上有著絕大的破綻三大德的白法習氣大德邏摩的白法習氣說可說是彌補經部無漏種子的缺陷的順正理論卷二八說大德邏摩作如是說世尊昔在菩薩位中三無數劫修諸加行雖有煩惱而能漸除煩惱所引不染習氣白法習氣漸令增長後於永斷諸漏得時前諸習氣有滅不滅以於長時修加行故證得無上諸漏永盡然佛猶有白法習氣言習氣有滅不滅故三無數劫是菩薩修行的時間這都是有漏的但在這個時期卻能漸漸的熏成白法習氣習氣在經部早已與熏習種子打成一片這白法習氣也就是淨界或無漏種它雖是有漏善熏習所引起的卻能成佛而不滅雖不能判明它是有漏還是無漏雖不知是否大德的創說但它確是給新熏無漏種子一個暗示瑜伽師地論攝決擇分與攝大乘論的有漏聞熏成為生起無漏現行的因緣不能說與這個思想沒有關係吧第三項大眾分別說系的解說成唯識論卷二說分別論者雖作是說心性本淨客塵煩惱所染污故名為雜染離煩惱時轉成無漏故無漏法非無因生心性本淨論者的淨性上面已一再說過它在心心相續中指出這明了覺知性是本淨的有漏無漏只是有無煩惱隨眠隱覆的不同有漏位的心識它雖沒有給予無漏種子的名稱但無漏法非無因生也早就適合無漏種的條件了它與經部同樣的以有漏心為無漏因經部或者還是受了分別說系的影響經部沒有指出貫通有漏無漏的覺性似乎還不及大眾分別說系透徹第四章無境論探源唯識有認識論上的唯識有本體論上的唯識我們所認識的一切即是識的影象這是認識論上的唯識至於宇宙人生的本體是否唯識卻還有問題有人雖主張認識中的一切只是主觀心識的影象但對認識背後的東西卻以為是不可知或者以為是有心有物的假使說心是萬有的本體一切從此出又歸結到這裡那就是本體論上的唯識了這本體論的唯識在認識上卻不妨成立客觀的世界佛教的唯識當然是出發於認識論又達到本體論的到了本體的唯識論又覺得所認識的有它相對的客觀性這才又轉到認識論上不離識的唯識了部派佛教裡沒有本體論上的唯識學認識上的唯識無境卻已相當的完成唯識思想的成熟主要是佛弟子們依著止觀實踐而獲得隨心自在的事實證明理論上從非斷非常的業感緣起的探討下展開了細心細蘊真我的思想能為因性的種習隨逐的思想因大眾分別說譬喻師的建立業因業果在心心所法的關係心與種習結成非一非異的融合完成唯識思想的一面任何學派沒有不承認我們認識的不正確沒有見到真理的全面或者根本沒有認識佛教的生死輪迴就是建立在一切錯誤中的根本錯誤上無明它障礙了真智的顯現蒙蔽歪曲了事理的真相使我們在虛妄的認識下顛倒造業流轉生死所以要解脫生死就要看透我們的根本妄執在這點上著力才能突破生死的罥索得到解脫要知道什麼是錯誤的認識就要研究到我們究竟認識些什麼這些不是真相那真相又是什麼在這樣的要求下認識論就發達起來引出了妄識亂現的思想外境無實的思想這又完成唯識學的另一面等到這細心種子與無境的思想融合唯識學也正式完成我們有種種的錯誤認識像無常計常非我計我無樂計樂不淨計淨一般人見到的快樂清淨在聖者看來卻完全不然不但凡聖的見解不同就是凡夫也是因人而不同的對象好像共同而引起的感情觀念不同這可以知道我們所認為如何如何並不就是實在是因能知的心情而轉移的這樣經部師就提出了境不成實的思想如大毘婆沙論卷五六說譬喻者說能繫結是實所繫事是假補特伽羅亦假彼說有染與無染境不決定故知境非實謂如有一端正女人種種莊嚴來入眾會有見起敬有見起貪有見起瞋有見起嫉有見起厭有見起悲有見生捨應知此中子見起敬諸耽欲者見而起貪諸怨憎者見而起瞋諸同夫者見而起嫉諸有修習不淨觀者見而起厭諸離欲仙見起悲愍諸阿羅漢見而生捨由此故知境無實體犢子部主張境結補特伽羅都是真實的有部雖說補特伽羅是假境也還是真實的它認為由境界力令彼別故一聚中容有二境故它以為所見的境界雖是不淨的但它本身也含有少分淨相依止這少分淨相想為非常的清淨因此起貪倒想為非常清淨確乎靠不住但這所依的少分淨相不能說不是真實譬喻者的見解卻不然境界的可意不可意因可意而生貪不可意而生瞋這要在某一有情的認識上才能成立並不是離卻能知心而有可意不可意的決定境界所以順正理論卷五三中說譬喻部師作如是說由分別力苦樂生故知諸境界體不成實以佛於彼摩建地迦契經中說諸癩病者觸苦火時以為樂故又說一色於一有情名可意境非於餘故單是這樣只能成立我們情緒上的苦樂愛惡是由心的分別力而生不屬於外境的本身與唯識無境的思想相差還很遠但它還有其它的見解像順正理論卷五三說又如淨穢不成實故謂別生趣同分有情於一事中取淨穢異既淨穢相非定可得故無成實淨穢二境有情因業力的關係在某一趣內受生或人或天或畜生或餓鬼因生趣的不同所見的淨穢也有差別像人見海水充滿清淨餓鬼卻見乾涸得一無所有或者是膿血火燄這隨類所見的不同不但是感情觀念的不同了境不成實更可以得一證明後代的唯識家常用天見寶莊嚴人見為清水魚見為窟宅鬼見為膿血的一境四心證明外境的無實也只是謂別生趣同分有情於一事中取淨穢異的見地經部的上座主張十二處是假有大眾系的說假部也有此主張這更接近唯識了順正理論卷四說此中上座作如是言五識依緣俱非實有極微一一不成所依所緣事故眾微和合方成所依所緣事故故處是假它從五識的不能緣極微相斷定一一極微的自體沒有作五識的所緣用不但一一沒有所緣用就是眾微和合眾微還是沒有作所緣的作用與如盲一一各住無見色用眾盲和集見用亦無一樣這樣五識所緣的境界只是和合的假相不是真實五根極微不論一一或是和集也同樣的不能為五識的所依五識是依根微和合的假用十色處既然是假法意二處也不是成實這是可以比類而知的十二處是假雖是說所依所緣的無實但所緣不但是五色處與無為受想行的別法處它是可以總攝一切的像順正理論卷三說又上座說諸法無非意所行故皆法處攝所緣的六處無實實際上達到了凡是我們所認識的一切都不是真實的結論真實的是什麼是十八界它在認識論上可說是二元的凡是有漏心所認識的一切都是假的不是法的實相在我們所認識的假相背後隱著真實的因果法相十八界這個見解初期的瑜伽派像本地分也還取同樣的見地它建立了離言自性假說自性在世間所認為真實的假說自性背後還有它所依的真實的離言自性它要建立有宗它認為沒有這離言的實性無法建立因果緣起它要反對徹底無自性的大乘經部的所緣無實與遍計所執的假說自性有關經部師怎樣從認識論的見地去解說所緣無實呢拿眼識緣色來說假使說眼識所顯現的青色就是眼識直接的親緣到的外境這除卻正量部的直取外境以外小乘都是不承認的見色的時候心上覺得它是什麼形相是什麼名稱這名相只是總名總相也可說是概念總名總相不是青色的自體它是無實的這樣的見解不但經部有部也會承認但依有部的見解這總名與總相是意識的境界確不是色法的真相眼識雖不能見一一極微的自相但眼識上所顯現的色相不論是極微的和合或和集它總是從那一一極微來的換句話說意識上抽象的概念不是真實的色法但依識上所顯現的青色不能說不依客觀的青色而成立眼識所見的青相與色法的青相是一致的它的見解青色是它自體是這樣的不是因能緣的心識而是青是色的所以它主張眼識能緣實境但在經部看來眼識並不能見到一一極微的自相只見到和合的假相這和合相極微上是沒有的所以眼識上所顯現的青相不與外界存在的青色一致因此眼識不能緣實境眼識雖緣不到色法的自相但並不能說沒有青色假使沒有超認識的青色也不能依它而在眼識上顯現和合的青相有部與經部的認識論有著很大的差別瑜伽派認為凡是有漏心識所認識的都是假說自性都不能離卻名言相像有部的客觀存在的青相是必然要反對的沒有名言識的力量決不能知道它是青是色它與經部一樣的在假說自性的背後建立離言自性這一一法的依它離言自性是必有的不然就是惡取空一切境界都不離心識名言的勢力這雖已達到了認識論上的唯識但隱在認識背後的離言自性經部說是十八界瑜伽派也承認它是緣起因果也不見得就是心吧似乎也沒有充分理由證實它就是虛妄分別的心心所真實義品成立離言自性引用小乘共許的教典我不知它比經部高超了多少在認識論上達到境不成實的思想在因果相續的緣起論上達到了細心持種能生一切的見解彼此結合起來這依它離言自性就是心中種子所變現的它就是心這是真實等到攔入認識界它就出現了別體能取所取的現象這是不真實的實無外境唯有內識的唯識論宣告成立
