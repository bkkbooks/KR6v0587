呾叉始羅接他到朅盤陀他造喻鬘論等數十部奠定了經部學說的基礎因他造喻鬘論等論所以也稱譬喻師經部的成立異部宗輪論說在佛滅四百年中錫蘭傳說是二百年中都是約說轉部說的然說轉部與經量部不同鳩摩邏多是經部譬喻師的本師他的大量著作寫在呾叉始羅國鳩摩邏多的時代約在西元二三世紀間從薩婆多部流出的經部成為薩婆多的勁敵原因不單是外來的多半是內在矛盾的展開薩婆多意思是說一切有說一切有思想的流行很早就存在到佛滅三百年迦旃延尼子造發智論積極的發揚三世實有的思想經過偏重的發展完成了大毘婆沙論的纂集迦濕彌羅的毘婆沙師才成為薩婆多的正統者實際上說一切有不一定是發智論大毘婆沙論學像經部譬喻論師西方尊者都可以說是說一切有者大體說迦旃延尼子是重論派鳩摩邏多是宗經派如俱舍論記卷二所說經部本從說一切有部中出以經為量名經部執理為量名說一切有部鳩摩邏多出世造論經部譬喻師與有部才明顯的分化迦旃延尼子並沒有統一薩婆多的思想連號稱婆沙四大評家的思想還有很多的意見是反婆沙而同於經部的像法救的諸心心所是思差別大毘婆沙論卷二異生無有斷隨眠義卷五一諸所有色皆五識身所依所緣卷七四化非實有卷一三五覺天的色惟大種心所即心卷一二七這都可以證明經部的思想多半是薩婆多本有的只是不同發智論大毘婆沙論系罷了發智論經迦旃延弟子們的演繹發揚在專斷的態度下罷斥百家建立了嚴密的極端實有論受婆沙抨擊的譬喻尊者派受了環境的影響融攝了有部異師才積極展開反婆沙的立場成為後來的經部譬喻師經部經歷了長期的發展因思想的紛歧自然的產生了不同的流派成唯識論述記卷四曾兩次談到經部的派別一說經部此有三種一根本即鳩摩邏多二室利邏多造經部毘婆沙正理所言上座是三但名經部以根本師造結鬘論廣說譬喻名譬喻師從所說為名也其實總是一種經部這雖把經部分為三類但除了解釋譬喻上座經部三個名稱的關係外並不能幫助我們理解經部思想的流派它又說經部本計滅定無心次復轉計滅定有心次有心所今更轉計彼無心所即末轉計這雖只是說明滅定的有心無心但很可以作為經部分派的標準經部學者的成立種子是一致的但一探討到種子的所依相續不斷者就必然的論到滅定的有無心識也就在這點上引起了內部的分派不過成唯識論述記所說的本計末計似乎還有問題依據漢譯的論典檢討經部思想的演變我認為是這樣的犢子說一切有分別說說轉譬喻上座師資先軌範師一類經量異部宗輪論所說的經部說轉建立勝義補特伽羅和一味相續的細蘊大體還繼承有部舊義從他的有我論說可說是有部和犢子部的折衷者從有部的法體恒住自性轉化到一味蘊確是在向種子思想前進這是經部初期的學說佛滅四世紀中西元二世紀後的鳩摩邏多才奠定了經部譬喻師的基礎他針對有部的三世恒有無為實有倡導無為無體過未無體不相應行無體夢影像化都非實有說放棄經部初期的細蘊說真我說建立了三相前後諸法漸生的相續轉變說離思無異熟因離受無異熟果把業力與業果歸結到內心接受了滅定有心說譬喻論者確是有部系中接近分別說系與大眾系的學者這是經部第二期的學說俱舍論順正理論與無著論師師資的著述中關於經部後期的學說有相當的介紹這時種子思想已大體完成龍樹菩薩時代已相當成熟但關於滅盡定的有無細心意見上不無出入可以歸納為三系一順正理論所抨擊的上座室利邏多和他的弟子大德邏摩主張滅盡定有細心而沒有心所上座師資繼承發揚譬喻論師的學說雖有多少演變還可說是正統的譬喻宗二俱舍論所說的先代軌範師先舊諸師即俱舍論論主所欽服的經部師他們是不許滅定有心的但要建立種子的相續所以倡導心與根身互為種子說他多少修改了譬喻師的宗義接近有部似乎是大毘婆沙論所擯棄的有部異師與譬喻學者的合流它與大乘阿毘達磨有深切的關係三大乘成業論中的一類經為量者在六識外別立持種受熏的集起心它已經超出六識論進入了七識論的領域依思想發展的程序該是比較後起的學派或許是受了大眾和分別說系的影響不論是研究經部的細心說或者種子說對這經部流派的概況是必須加以正確的認識二譬喻者的細心說初期譬喻論者的細心說像大毘婆沙論卷一五二說謂譬喻者分別論師執滅盡定細心不滅彼說無有有情而無色者亦無有定而無心者若定無心命根應斷便名為死非謂在定卷一五一又說到無想定有心理由是同樣的譬喻者說沒有無色的有情沒有無心的定可知譬喻者的本義與分別論者和大眾部是一致的它所說的滅定有心究竟是怎樣的心呢有心所還是沒有他說離受無異熟果無想滅定既然是有情總不該說沒有受異熟果的受吧假使有受那又怎麼說滅受想呢根據現存片段而不完備的文獻對它的本意如何是無法確實理解的或者譬喻論師初期的學說還沒有考慮到這些三世友的細心說主張滅定有細心的還有尊者世友像大乘成業論說如尊者世友所造問論中言若執滅定全無有心可有此過我說滅定猶有細心故無此失如契經言處滅定者身行皆滅廣說乃至根無變壞識不離身玄奘門下說這位世友尊者是經部異師像俱舍光記卷五說印度國名世友者非一非是婆沙會中世友成唯識論述記卷四也有此即經部異師的話他所說的細心依大乘成業論說已有不同的見解所以世友的本意也無法明了但另有一分學者認為造問論的世友並不是經部異師正是有部的世友他們所持的理由有兩點一大乘成業論的異譯業成就論說若毘婆沙五百羅漢和合眾中婆修蜜多即世友的梵音大德說言二俱舍論卷五敘了尊者世友問論的意見後緊接著妙音尊者的批評這不但世友妙音都是婆沙評家之一就是尊者兩字依大毘婆沙論俱舍論順正理論等使用的習慣除有部系以外是不輕易授人的這二個不同的見解誰是正確的很難加以判斷然據我最近的研究這確為初期的譬喻大師就是尊婆須蜜菩薩所集論的作者世友屬大德法救的後學比妙音早一些他的思想與阿毘達磨大論師世友完全不同譬喻師為說一切有部的一系所以也被稱為尊者四上座師資的細心說順正理論所抨擊的上座名室利邏多和世親眾賢同時曾造經部毘婆沙是有名的經部大師大德邏摩是他的弟子上座繼承譬喻者的宗義說滅盡定有細意識像順正理論卷一五說然上座言思等心所於滅定中不得生者由與受想生因同故非由展轉為因生故彼許滅定中有心現行故這裡雖指出了滅盡定沒有受想等心所卻有心識現行但這無心所的細識是意識還是六識以外的細心也還不能判明參考其他論典關於有心無所的記載可以知道上座的細心是微細的第六意識如大乘成業論說有說此滅定位有第六意識故此位中唯餘意識無諸心所攝大乘論或唯識論在說明識不離身的識是阿賴耶識時都評破這無心所的細心說有心而沒有心所這在有心必有所無所就無心的學者確是不易信受的成唯識論卷四批評他說若無心所識亦應無不見餘心離心所故此識應非相應法故若此定中有意識者三和合故必應有觸觸既定與受想思俱如何有識而無心所以有心必有所無所就無心的原則評破滅定有心無所說我想要是真正的經部學者對他們所持的理由是會根本加以否認的上座在經部中是有心所受想思三法派關於心心所法的生起不同有部的一時相應他繼承譬喻者的心心所法前後而起的主張像順正理論卷一說如伽他言眼色二為緣生諸心所法識觸俱受想諸行攝有因上座釋此伽他義言說心所者次第義故說識言故不離識故無別有觸次第義者據生次第謂從眼色生於識觸從此復生諸心所法俱生受等名心所法觸非心所說識言者謂於此中現見說識故觸是心非心所法不離識者謂不離識而可有觸識前定無和合義故假名心所而無別體由彼上座義宗根境無間識方得起從識無間受乃得生心心所法的生起是前後次第的根境和合生起初剎那的識就在這識的依根緣境的和合上假名叫觸觸是依根境識三者的和合而假說的並沒有別體的觸心所這識觸作等無間緣引起第二念的受次第生起想思從受到想到思也不是同時的一般的心理活動是這樣滅受想定卻不然在修習滅盡定的加行時厭患受想的粗動作一種如生著癰疽或中了毒箭般苦痛可厭的觀想因這厭離受想的作意所以入定的時候受想都不起只有微細意識的存在明白點說滅受想定是生起意識以後不再引起粗動的感情受想像想造作思等心所唯是平靜一味的意識的延長有此細心的存在一切法所熏成的舊隨界就可以相續不斷獲得未來的果報大德邏摩也和上座一樣主張滅定有心順正理論卷二六說滅盡定中意處不壞由斯亦許有意識生然闕餘緣故無有觸大德雖同樣的主張滅定有心但師弟之間還存著小小的差別有細心而沒有心所據順正理論卷一三所說有兩派一派是有觸的一派是無觸的上座的細心說論上雖沒有明文但從他的現見說識為觸故觸是心非心所法看來觸是建立在識與根境的和合上根境和合生識能說它沒有觸嗎同時凡說到上座的細心說都沒有說沒有觸滅受想定無心所只是不起依心別起的心所受想思不離識而假立的觸那又何妨說是有呢但大德卻認為不但沒有受想也沒有觸上面的引證是很明白的了他們師弟間為什麼不同呢經部學者關於心所的見解是非常參差的順正理論說或說唯有三大地法或說有四受想思觸大德或許是四心所者所以滅盡定中也沒有觸吧五一類經為量者的細心說六識論者的滅定有心說確有他的缺點有心所呢那就與一般的意識沒有分別也不能說是滅受想定沒有心所呢就是有心無所是可能的也只可以說無心所定不能說是無心定經部中的一分學者不滿意六識論者的細心說覺得它不能圓滿解釋釋尊的本意它受分別說大眾系思想的激發在長期的體認與探索下走上了七心論像大乘成業論說一類經為量者所許細心彼滅定位猶有謂異熟果識具一切種子從初結生乃至終沒展轉相續曾無間斷彼彼生處由異熟因品類差別相續流轉乃至涅槃方畢竟滅即由此識無間斷故於無心位亦說有心餘六識身於此諸位皆不轉故說為無心心有二種一集起心無量種子集起處故二種種心所緣行相差別轉故一類經為量者把心分成集起種種二類種種心就是六識所緣的境界取境的行相都有種種的差別所以叫種種這種種心六識是一般人所能經驗與自覺的離種種心以外還有一味相續的集起心依大乘成業論的解說集起心是一切有情的異熟果識異熟果是從善惡業因所感得的果報也就是有情生命的當體總異熟果它是一味相續不斷的直到生死的最後邊才究竟滅盡它為什麼稱為集起呢它含攝蘊藏著一切法的種子能攝藏是一切種子積集的所在所藏處所以叫集因善或不善諸法的熏習使種子生果的功能漸漸地發展擴大成熟一遇外緣的和合就從集起心所攝藏的種子生起可愛或不可愛的果報這就是起從集起的意義上說它不但是生命的當體還是萬有的動力也可以說是宇宙萬有的本源它開展一切總攝一切是一切的中心唯識學上的本識思想已到含苞待放的階段了阿含經時常說到此心此意此識但三者的區別並沒有給以明確的界說後代的佛弟子從釋尊的教法裡去尋求三者的意義見經上說意為先導就說依前行業說名為意見經上說心遠獨行就說依遠行業說名為心這樣經上對心意識三者名詞的使用有時是共通的有時是差別的就是一個名詞也有種種的意義所以像大毘婆沙論卷七二俱舍論卷四順正理論卷一一顯宗論卷六都說心意識三者的體性是同一的不過意義上有種種的差別這心的集起義也是各種意義中的一種佛在阿含經裡曾這樣說轉引成唯識論卷三雜染清淨諸法種子之所集起故名為心大毘婆沙論等都說到集起或作採集義為心心有集起的作用並不是經量學者的創見有它思想上的淵源與教證的集起或採集是什麼意義有部的意見然經說心為種子者起染淨法勢用強故見成唯識論卷三它根本不承認有種子更談不上種子的積集處和心中所藏種子的現起它認為心有分別有引起雜染清淨諸法的強有力的作用所以稱之為心為種唯識了義燈卷四敘著各派關於說心為種子的意見可以參考經部學者像上座師資們的細意識是所熏習能持種子細意識上相續轉變差別的生果功能是生起一切諸法的因緣它們雖沒有離六識以外建立集起心但對心有種子積集處和心上功能生起諸法的集起義也早就成立一類經為量者只是在六識以外建立一個一味相續的細心而已主張滅定有心本來在執持根身和任持業力現在既建立了第七細心那集種起現的作用自然也移歸第七無心定和滅受想是依六識說的定中的識不離身是依集起心說的以集起心釋滅盡定的識不離身可說恰到好處這集起心與唯識學上的本識幾乎無從分別但切勿以為這就是第八識第八識要別立第七末那後才開始成立這經為量者的細心說只可說是瑜伽派賴耶思想的前驅與解深密經說相近細心說的發展是從六識到七識從七識到八識這中間的發展是多邊的分離而綜合綜合而又分離的所以部派佛教的細心說有種種不同的面目大乘佛教的七心論與八識論也自然有著很大的出入本識思想的發展既不是一線的融合而成的本識自然也不能完全同一這點要時刻去把握它乙王所一體心心所的一體異體與俱起別起在部派佛教裡有著不同的意見譬喻論師一體前後起經部上座師資一切有系別體前後起法救覺天有部正統派大眾分別說犢子別體同時起從各派的見解看來大眾分別說犢子和有部的正統者都是心心所的別體論者同時相應論者釋尊的本意似乎也就在此但從有部流出的譬喻論師卻提出了心所即心次第而起的異見像大毘婆沙論卷一六說有執心心所法前後而生非一時起如譬喻者彼作是說心心所法依諸因緣前後而生譬如商侶涉險隘路一一而度無二並行心心所法亦復如是眾緣和合一一而生所待眾緣各有異故這種思想一方面它在經典裡發見了一體的思想發見了心心所法的共同性一念心中有受想思等心所同時釋尊確乎說得很多但經上也自有有心無所的記載這在成實論順正理論裡無心所家都引著很多的證據像最初受生時只說識入母胎沒有說到心所像構成有情的成分只說士夫六界地水火風空識也沒有心所在內尤其是經上說的心遠獨行可以看出唯有一心的現起不能同時有多心所譬喻論師的譬如商侶涉險隘路也是從這獨行二字推闡出來但這不違反心心所俱時相應的聖教嗎不一心俱有不是說一剎那心有很多的心心所是說在一期相續心中剎那生滅不是常人能經驗覺察得到我們自覺到內心有異常複雜的心理活動這只是相續心中綜合的自覺雖好像同時其實是前後的那怎能分別心與心所呢可以分別像成實論卷五說心所生法名曰心數心所的異譯心從心生故名心數前心能生後心後心就叫做心所在這前後的連繫上建立相應也不同有部那樣同時俱起的相應怎麼說發現了心心所的共通性呢在它的意見能了知叫識那個心所不能了知呢能緣慮叫心成實論卷五決無沒有能緣作用的心所心所為什麼不就是心它無從確定心與心所的絕對界限自然會走上一心異名的思想順正理論卷一一說有譬喻者說唯有心無別心所心想俱時行相差別不可得故何者行相唯在想有在識中無深遠推求唯聞此二名言差別曾無體義差別可知譬喻論師的心所即心差別一方面是反三世實有論者的機械分析論說一切有部的正統者分別名相是他們得意的傑作看到阿毘達磨發達的程度就可以想像而知他們治學的態度是從分析假實下手一方面根據經典的一言一語一方面作內省的分析考察把現象分析一下把假合的分了出來建立了色心心所不相應行無為最後的單元就是不可再分割的實體俱舍論分為七十五類他不但從時間的觀念上解釋做前後只是相似的連續而前後的法體各別就是在一念心中他也把心理的動態作一種抽象的分析了知是識領納是受一一的把它分離開來想像法體的彼此隔別性他粉碎了世間使世間成為獨立的無限量的實在體多元再把它組合起來在彼此前後生起的作用上發生連繫他不把世間看成有機的統一是把它看成機械的活動譬喻論者徹底反對這個觀點反對循名執實的瑣碎分析才建立了一心前後說但他不免矯枉過直了在大乘佛教裡不論是王所一體或別體對心心所法前後次第而起的見地都是排斥了的他忽略了內心的複雜作用在佛滅四世紀時的法救覺天雖被人稱為婆沙四大評家之一但他們是思心差別論者實際是譬喻論師像大毘婆沙論卷二說尊者法救作如是言諸心心所是思差別尊者覺天作如是說諸心心所體即是心藏傳覺天立五心所心心所體一義異的思想一直流到後代成實論主也還是這樣但經部後起者上座大德都採取了折中主義承認心外別有心所同時也不像有部那樣分析得過分瑣細但離心的心所究竟有多少呢釋尊沒有提出一個心所單元表他們的見解也自然不能一致或說有三或說有四或說有十或說十四這還只是經部假使加上有部銅鍱部的見解那就更聚訟紛紜了這也難怪無心所家的譬喻師要來個一掃而空像順正理論卷一一說又於心所多興諍論故知離心無別有體故唯有識隨位而流說有多種心心所別我等現見唯有一識漸次而轉故知離心無別心所第四節分別說系與本識思想第一項分別說系心識論概說分別論者是上座部三大系之一它流出化地飲光法藏紅衣四部它在探索繫縛解脫的連鎖和三世輪迴的主體時已發現了深祕細心的存在上座系的本典舍利弗阿毘曇已把六識與意界分別解說並且說意界是初生心規定初生心為意界而不是意識這是非常有意義的細心思想的最初倡導者我認為是它分別論者在印度本土的如大毘婆沙論所說是一心相續論者這相續的一心還是心性本淨的客塵所染的從分別說而流出的學派南方的銅鍱部建立著名的九心輪北方的化地部卻轉化為窮生死蘊的種子說與經部合流唐玄奘說上座學者有離粗意識而別立同時細意識的分別說系的細心說與唯識學的本識確是非常的接近第二項一心相續謂譬喻者分別論師執滅盡定細心不滅彼說無有有情而無色者亦無有定而無心者若定無心命根應斷便名為死非謂在定據大毘婆沙論卷一五二所說滅盡定無想定中有細心分別論師與譬喻者的見解相同但譬喻者是心心所前後相續論者分別論師卻是王所同時相應的相續論者心識相續的見解他倆有很大的差別分別論者以心性本淨說著名這是一般所熟知的這裡先對它的覺性融然一體論加以簡單的考察分別論者的心性本淨大毘婆沙論曾稱之為一心相續論者像卷二二說有執但有一心如說一心相續論者彼作是說聖道未現在前煩惱未斷故心有隨眠聖道現前煩惱斷故心無隨眠此心雖有隨眠無隨眠時異而性是一如衣鏡金等未浣磨鍊等時名有垢衣等若浣磨鍊等已名無垢衣等有無垢等時雖有異而性無別心亦如是這一心相續論者論文雖沒有明白的說是分別論者但它的心性無別與分別論者確是完全一致的相續中的染心與不染心有部等說體性各別分別論者卻說心性是同一的同一的本淨心性依成實論卷三的解說只是覺性眼識也好意識也好有煩惱也好無煩惱也好這能知能覺的覺性並沒有分別大毘婆沙論卷一一還有覺性是一論者其實也就是分別論者一心論的異名它說有執覺性是一如說前後一覺論者彼作是說前作事覺後憶念覺相用雖異其性是一如是可能憶本所作以前後位覺體一故前位所作後位能憶這一覺論者依前後一覺的理由成立追憶過去的可能它的相用雖異其性是一豈不與一心論者的此心雖有隨眠無隨眠時異而性是一的見解相同嗎從它的前後覺性是一也可看出與一心論者的同一何況成實論還明說本淨的心性就是覺性把一覺論者一心論者分別論者的思想合起來研究它是從心識無限差別的生滅中發見了內在統一的心性一心論者為什麼要建立一心它從差別到統一從生滅到轉變從現象到本體還是為了解決嚴重而迫切的問題生命緣起成實論卷五曾說到一心論者建立一心的用意又無我故應心起業以心是一能起諸業還自受報心死心生心縛心解本所更用心能憶念故知心一又以心是一故能修集又佛法無我以心一故名眾生相一心論的目的在說明自作自受律記憶的可能被縛者與解脫者的關係並且依一心建立眾生一心論者不像犢子系建立不同外道的真我因為佛法是無我的但不能不建立一貫通前後的生命主體於是建立一心論心理的活動與演變不能機械式的把它割裂成前後獨立的法體從現象上看雖然不絕的起滅變化而無限變化中的覺性還是統一的這一體的覺性豈不是常住嗎這在反對者的學派看來一心只是變相的神我像成實論卷五主的批評說若心是一即為是常常即真我所以者何以今作後作常一不變故名為我反對者的意見固然把它看成外道的神我但在一心論者卻認為非如此不能建立生命的連鎖若剎那生滅前後別體無法說明前後的移轉成實論敘述它的意見說以心是一故能修集若念念滅則無集力本著剎那生滅不能安立因果連繫的觀點才考慮到心性的一體這不但一心論者如此犢子的建立不可說我經量本計的一味蘊也都是感到剎那論的困難而這樣的但機械的統一論者決不能同意像順正理論卷七說或謂諸行若剎那滅一切世間應俱壞斷由此妄想計度諸行或暫時住或畢竟常第三項心性本淨略說問題的重要性心性染淨的論辨在佛教尤其唯識學上佔有非常重要的地位從過去大乘唯識學的諍論上看它幾乎成了一切糾紛的癥結我們假使不能理解部派佛教發展中的心性染淨論那麼在研究大乘唯識學時就容易偏執一邊大乘論師的多種解釋大都有它思想上淵源的事實上心性本淨的思想滲透到一切大乘經裡凡是讀過大乘經的誰也會有此感覺這是每一佛教徒尤其大乘唯識學者必須探討的主題從部派佛教去看關於心性染淨的思想有三大系但心通三性論者是後起的大乘佛教似乎沒有這個思想一切有系犢子系分別說系大眾系經部有部心通三性家心性無記家心性本淨家性的定義很多水濕性地堅性這是說一事一物各別的自體性種性本性住性這或者是說本來如是或者是說習慣成自然有生成如此的意味與中國的生之謂性相近法性實性在大乘的教理上或指普遍恒常的法則或指諸法離染的當體自性在龍樹學裡是說那不從緣起的常一的自體善性惡性這是性德的性就是性質這心性染淨的思想與中國的性善性惡發生過深切的影響王陽明竟說性善的良知良能就是佛家的本淨心性本來面目其實心性本淨在部派佛教裡是性善性惡的性在大乘裡心性與法性有時合而為一指心或法的本體佛法的心性本淨是遍一切眾生的孟子的性善卻成為人獸的分野這是怎樣的不同一切法給以道德的評價就有善惡的概念心性無記論者關於善惡是分為三類一善性二惡性三無記性善惡世學有著很多的定義也有見到它的相對性而否認善惡的標準心性無記論者善惡是從它的結果而分別的我們意念與身口的行動假使能得後來良好的結果這就是善若會引起惡劣的結果那就是惡這結果偏重在個人是依招感現世不是現在一念後世的果報來決定這不太自利嗎不凡是有利於人的也必然的會有利於己反之損人利己的行為從引起後世的惡報看無疑是惡的還有很多的事不能引起未來善惡的果報如不自覺的搖一搖頭努一努嘴這些行為就不能說是善惡那就叫無記性身外的山河大地草木叢林的變動也是無記這無記不是善惡的化合是非善非惡的與善惡鼎立而三的中容性就因為它是無記所以也可以和善惡合作有部從心心所別體的觀點把心上一切的作用分離出來使成為獨存的自體剩下來可以說是心識唯一作用的就是了知單從了知作用來說並不能說它是善或是惡不過心是不能離卻心所而生起的倘使它與信慚愧這些善心所合作起來它就是善心與貪瞋等合作那就是惡心如果不與善心所也不與惡心所合作相應如對路旁的一切漠不關心的走去雖不是毫無所知但也沒有善心所或惡心所羼雜進去那時的心只與受想等心所同起這就是無記性所以善心惡心不是心的自性是善是惡只是與善惡心所相應的關係善心像雜藥水惡心像雜毒水水的自性不是藥也不是毒善惡心所與心滾成一團是同一所緣同一事業同一異熟好像心整個兒就是善是惡也不再說它是無記的但善惡究竟是外鑠的不是心的本性心的本性是無記的中容性譬喻論師也像有部那樣分為三性但它不許心性無記主張心通三性這還從心心所法一體的見解而來譬喻論者是王所一體論者心王心所只是名義上的差別其實都就是心信慚愧等善心所貪瞋等惡心所都是心識不同的形態這樣心自然是通於三性雖然有部也可以說通三性但它是建立在相應上譬喻論師們是依心的自性說的經說心長夜為貪等所污這似乎與譬喻者的貪即是心有相當的違難但它說這是依假名相續心說的並不是在一剎那中有別體的心為別體的貪等所污它的心通三性論就這樣的建立起來心性本淨說除上面兩系以外還有在佛教裡放射異樣光芒的心性本淨說它的根據是經上銅鍱部的增支部有此說說轉引順正理論心本性淨有時客塵煩惱所染經有心性本淨的明文有部它們是不會毫無所知為什麼還要建立心性無記心通三性呢這不是與佛共諍嗎不經上也在說善心惡心心性本淨的聖教一切有部的學者有點不大信任但也還不致絕對否認給它個適當的解說像順正理論卷七二說若抱愚信不敢非撥言此非經應知此經違正理故非了義說若爾此經依何密意依本客性密作是說謂本性心必是清淨若客性心容有染污本性心者謂無記心非慼非欣任運轉位諸有情類多住此心一切位中皆容有故此心必淨非染污故客性心者謂所餘心非諸有情多分安住亦有諸位非皆容有斷善根者必無善心無學位中必無染故如是但約心相續中住本性時說名為淨住客性位容暫有染順正理論主是正理為宗的人物它的內心上當然要否認是經文否認它的理由是不合自宗的正理它的解說心性本淨是依無記心說的它沒有依心性無記說只說心住無記位中沒有染污心所所以稱為本淨心通三性論者批評了心性本淨以後也照樣的給它個融會如成實論卷三說但佛為眾生說心常在故說客塵所染則心不淨又佛為懈怠眾生若聞心本不淨便謂性不可改則不發淨心故說本淨它們雖都解釋心性本淨其實是心性無記論和心通三性論者心性本淨說還得另行研究心性本淨雖有人反對但自有它古老的淵源在上座系舍利弗阿毘曇卷二七已明白的宣說心性清淨為客塵染凡夫未聞故不能如實知見亦無修心聖人聞故如實知見亦有修心心性清淨離客塵垢凡夫未聞故不能如實知見亦無修心聖人聞故能如實知見亦有修心舍利弗阿毘曇說心性本淨與離垢清淨尤其把性淨看做有沒有修心的重要關鍵成為出離生死必先理解的條件使我們自然的聯想到楞嚴經的皆由不知常住真心覺得它有同樣的意趣舍利弗阿毘曇裡除心性本淨以外還有我法二空的思想大眾與分別說系都在倡導心性本淨可見這並不是後起的思想了大眾分別說系的心性本淨說我們難得具體完備的認識現在只能稍微提到一點好在大乘佛教裡已有了深刻豐富的解釋大眾系不像有部那樣建立三性它是無無記法的它認為一切法不是善就是惡只是程度上的差別沒有中容性存在這點不但與心性本淨有密切關係還影響到一切像有部的因通善惡果唯無記的業感論在不立無記的見解上豈不要有大大的不同嗎分別論者的心性本淨與大眾系也不同它承認善惡無記的三性同時又建立心性本淨心性是否本淨這都在說明有染離染有漏無漏的地方提出像大毘婆沙論卷二七說分別論者說染污不染污心其體無異謂若相應煩惱未斷名染污心若時相應煩惱已斷名不染心如銅器等未除垢時名有垢器等若除垢已名無垢器等順正理論卷七二說分別論者作如是言唯有貪心今得解脫如有垢器後除其垢如頗胝迦由所依處顯色差別有異色生如是淨心貪等所染名有貪等後還解脫聖教亦言心性本淨有時客塵煩惱所染還有一心相續論者的意見已在上面引過我們要理解心性本淨先得考慮有漏無漏的定義怎麼叫有漏呢薩婆多正統派的意見是與漏隨增像俱舍論卷一說有漏法云何謂除道諦餘有為法所以者何諸漏於中等隨增故緣滅道諦諸漏雖生而不隨增故非有漏漏的本身是煩惱有漏是道諦以外的一切有為法這些法或者與煩惱相應或者為煩惱所緣不但與煩惱相應是煩惱所緣要有增益煩惱的力量才稱為有漏像滅諦道諦雖也能為煩惱的所緣但不能增益煩惱所以不是有漏這樣有漏無漏不是說煩惱的作用有無是說某一法有無增益煩惱的作用有漏心無漏心也自然是截然各別的東西但有漏無漏不一定這樣解說像順正理論卷一說譬喻論師妄作是說離過身中所有色等名無漏法又彼起執依訓詞門謂與漏俱名為有漏譬喻論師的見解有漏無漏是說有沒有與煩惱共俱內心有煩惱像凡夫的色身就是有漏斷盡了煩惱像佛的色身就是無漏譬喻者是心所即心論者與心性本淨論者當然有不同但依這樣的思想去理解也可得心性本淨的結論心是能覺了性與漏俱有就是有漏心離卻煩惱就是無漏心有漏無漏的分別在有沒有與煩惱俱有未斷煩惱心只能說是有漏並無應有漏心性是無漏若異生心性是無漏的過失一心相續論者的意見有漏的念念生滅心雖或善或惡或無記但演變中的覺性永遠是了了明知這明了的覺性就是淨心與三性都不相礙不過在煩惱未斷時覺知上出現了歪曲的認識假使錯誤的成分愈少心也愈逼近它的真相這明淨的覺性遍通三性不能單說是善是無記這要談到性淨相染的問題大毘婆沙論卷二七說分別論者彼說心本性清淨客塵煩惱所染污故相不清淨性淨相染在有部學者看來是不可想像的性相是一貫的本性是淨怎能與煩惱相應轉現染相呢相既然不淨本性又如何可說清淨心性本淨論者舉出了衣鏡金銅器頗胝迦寶日月五事所覆作譬喻但有部學者不是說賢聖法異世間法異就是從剎那生滅的見地來解說像順正理論卷七二說如濁水滅後水生時離濁澄清名為淨水前餘色俱頗胝迦滅後與餘色俱新生故它的另一見解凡是相應相合彼此的體性不能有染淨的差別所以它說五事隱覆日月輪並不是相應相合心性本淨論者有漏無漏建立在漏的有無而不在心的自體所以即使剎那生滅像有部那樣也不能搖動心性本淨的理論關於相應相合就不能不表示異議日月輪是明淨的因了煙雲的覆障才見它的相不清淨這不淨是日輪與煙雲發生關係而現出的假相其實日輪還是清淨的相有雜染是依和合的假相而說不是說它的本性有什麼轉變假使心性起了變化也就不成其為本淨了這不是說雜染全是假相客塵確是雜染只是覺了的心用上的染相是現起的假相罷了講到濁水水的本性也是淨的只是羼雜些泥塵有部學者忽視了從濁水澄汰出來的塵污卻見到了前一剎那的濁水滅去後一剎那的清水出現有部的剎那論只是前後剎那的堆積剎那論究竟是否一定如此還有討論的必要本客是內在與外鑠的關係在煩惱現起時雖覺得整個心是染污的其實內心並不變失它的自性只是現象上有些歪曲要理解本客還得在相續中不從前後的關係上去觀察不易理解本淨的成實論卷三說問曰心名但覺色等然後取相從相生諸煩惱與心作垢故說本淨問曰我不為念念滅心故如是說以相續心故說垢染成實論主不能同情這個思想以為相續心是假名不是真實這是它的時間觀不同心性本淨論者是一心相續論者一心相續論者參看分別論者的一心相續論是在前後不斷的演化中發見它相互一貫的不變性前後不異的共同點拿心來說就是了了覺知性常心與一心不過是覺性不變的異名常心並不是外道妄想構成的不生不滅非因非果離世間而獨存的東西它只在隨緣觸境的作用中換句話說常就是無常就是念念生滅若不能認取無常中的真常那麼無常念念滅只是斷滅論我們必須認識剎那生滅不是前後成為隔別物相續也不是前後機械的累積在大眾分別說系當然有著很多的難點這一直要到一切皆空論者才能完成這相續不斷的理論才能克服那嚴重而困難的問題在後期的大眾分別論者發見了七心論以後那一味相續的覺性又漸漸的與起滅的六識分離但還保持密切的關係心性本淨在轉凡成聖的實踐上有它特殊的意義薩婆多部的意見三乘無漏聖法早已具足在未來法中只要加以引發使它從未來來現在繫屬有情就是大眾部等主張過未無體那就不能像有部那樣早已具足在未來中無漏淨法的生起在未來無實論者顯然成了問題它必須指出有漏位中可以成為無漏的東西心性本淨就是這淨法本有的見解大乘本有佛性的思想都是以這心性本淨為前驅的分別論者的貢獻確是太偉大了第四項五法遍行與染俱意大毘婆沙論卷一八說有執五法是遍行謂無明愛見慢及心如分別論者如彼頌言有五遍行法能廣生眾苦謂無明愛見慢心是為五大毘婆沙論在說遍行因的地方談到分別論者五遍行的意見分別論者把心看為遍行之一當然與有部遍行因的定義不同後代唯識學者也有遍行心所但無明愛見慢心也不合遍行心所的定義五法遍行的本義從它廣生眾苦看起來是眾生的恒行微細煩惱是發業感果的動力我覺得這五法遍行說是末那思想的前身一切眾生都有恒行的細心這細心是與無明愛見慢相應的末那四惑相應的思想從分別論者演化而來這或許不是唯識學者所意料的吧分別論者是心性本淨論者它的四惑相應當然是客塵微細的分析它不能超過七心論的範圍它的五法遍行要與業報主體的細心結合起來才能理解它的本義隨眠是生起煩惱的潛能是心不相應行習氣是羅漢不斷的煩惱氣分這五法遍行中的無明愛見慢是心相應的又是羅漢所斷的它是眾生一切時中遍行的微細的染心所化地部末宗因解釋一頌不同而分派的五法能縛說也與五法遍行有關附帶要說明的是四無記根像品類足論卷一說四無記根即無記愛無記見無記慢無記無明有部正統派只立三無記根四無記根的思想卻被外方諸師保存著見俱舍論卷一九無記的無明愛見慢漸漸的被佛弟子結合在一起被認為煩惱中的細分是生起有覆無覆無記的根本這與末那的四惑相應也不能說毫無關係吧與分別論者五法遍行有關的還有染意恒行說成唯識論卷五曾引解脫經說染污意恒時諸惑俱生滅若解脫諸惑非曾非當有解脫經瑜伽學者認為佛說第七末那識的明證這當然是很有意義的解脫經頌瑜伽師地論卷一六引證得比較詳盡瑜伽師地論的頌文是非常明顯的心性本淨說這不能不使我們懷疑到瑜伽學者的斷章取義瑜伽師地論說染污意恒時諸惑俱生滅若解脫諸惑非先亦非後非彼法生已後淨異而生彼先無染污說解脫眾惑其有染污者畢竟性清淨既非有所淨何得有能淨性淨塵染瑜伽派的唯識學者自有很好的解說不必與分別論者相同但我覺得性淨與塵染大小經裡都集中在一切識或藏心或空性身上很少幾乎可說沒有單把性淨塵染規定為第七識的這思想的矛盾是這樣的細心是從種種的要求出發融合成幾個不同典型的細心一分八識論者最初把細心的一分微細我執讓它分離出來建立第七識到護法他們又把整個的微細塵染從屬於第七識因此性淨塵染的聖教也被拿來證明末那結果與藏心本淨客塵所染說自然成為矛盾另一分的八識論者對第七第八二識的性質作用的區別說得也有些出入唯識學上的爭論也就從此無法解決我不是說瑜伽學者如何錯誤不過說七識與八識不一定像護法說的罷了在我看來七心論已能解決一切至少八識論者能懂得一點七心論的關鍵對唯識學上諍論的處理是大有裨益的這塵染的思想與微細潛在的煩惱有關可以對看比較第五項有分識有是欲有色有無色有三有分是成分也就是構成的條件與原因在以分別說部自居的赤銅鍱部把細心看成三有輪迴的主因所以叫有分識赤銅鍱部在阿育王時代移植到錫蘭又發展到緬甸暹羅一帶一般人稱他為南傳佛教現在的南傳佛教以覺音三藏的注釋作中心覺音是後起的是西元四世紀的人物思想上有相當的演變所以有人叫他做新上座部有分識在漢譯的論典裡一致的說是上座分別說部即赤銅鍱部的主張關於有分識無性攝大乘論釋卷二有簡單的敘述也就是奘門所傳九心輪的根據無性釋說上座部中以有分聲亦說此識阿賴耶識是有因故如說六識不死不生或由有分或由反緣而死由異熟意識界而生如是等能引發者唯是意識故作是說五識於法無所了知唯所引發意界亦爾唯等尋求見唯矚照等貫徹者得決定智安立是能起語分別六識唯能隨起威儀不能受善不善業道不能入定不能出定勢用一切皆能起作由能引發從睡而覺由勢用故觀所夢事如是等分別說部亦說此識名有分識無性攝大乘論釋關於有分識的說明奘門師弟給以九心輪的解說依窺基說實際上只有八心因為從有分出發末了又歸結到有分把有分數了兩次成一個輪形所以名為九心輪成唯識論樞要卷下就是這樣說的上座部師立九心輪一有分二能引發三見四等尋求五等貫徹六安立七勢用八返緣九有分然實但有八心以周匝而言總說有九故成九心輪西藏所傳無著論師的攝大乘論也有有分識的記載但只有七心聖上座部教中亦說名曰有分及見分別及行動及尋求第七能轉此七心或九心的見解在漢譯解脫道論卷一中有較為詳確的說明於眼門成三種除夾上中下於是上事以夾成七心無間生阿毘地獄從有分心生轉心見心所受心分別心令起心速心彼事心從彼更度有分心九心的次第演進除有分唯有七心是依五識最完滿的知意活動而說五識的中下意識的上下雖不出此九心的範圍但都是不完具的解脫道論是上座銅鍱者的論典依銅鍱者的看法意識是一切心理作用的根本一切心識作用不外意識的不同作用所以他是一意識師一心論者照他說有分心是有根心如牽縷是三有的根本心即是生命內在的心體從過去一直到未來在從五識而作業受果的過程中從有分生起七種心第一轉心是根境相接時有分心為了要見外境而引起內在的覺用奘譯作能引發即藏譯之動近於警心令起的作意因轉心的活動現起眼等根識直見外境是第二見心五識雖剎那間直取對象但還不能有所了知接著生起第三受心承受見心所攝取的資料加以體察一譯作尋求心是屬於攝取對象與了解對象間的心用等到明確的了解知道是什麼即是第四分別心奘譯稱之為能起語言分別的安立在此分別心以前奘譯多一等貫徹藏譯也沒有所以玄奘所傳的九心輪有影射瑜伽五心輪的痕跡如見是率爾心尋求是尋求心等貫徹與安立是決定心勢用以下是染淨心等流心而解脫道論的次第是接近無色四蘊的如見心是識受心是受分別心是想令起速行心是思這點是值得注意的奘譯在安立以下起勢用心而解脫道論卻多一第五令起心這是說從見到分別是對外境的認識過程因認識而引起推動內心作業的意志作用因此接著就是動作行為的第六速行心令起是引起作業的速行是作業的作業而得果也即是作業終了時心識的休息是第七彼事心奘譯作反緣但這還是從行動而返歸內心的過程到了內心澄靜的本來那就是復歸於有分心了從上面所說可知有分是心識的內在者深潛而貫通者見受分別是向外的認識作用速行是向外的意志作用轉令起彼事是介於中間的轉是內心要求認識的發動已不是內在的深細心也還不是認識令起心是認識的牽動內心引起內心意行的反應但還不是行為者彼事是行業的反歸內心過程認識與行為的作用一止那又是有分了見受分別速行意轉令起彼事有分有分從唯識學上本識的見地去看應注意它的初生心命終心無性攝大乘論釋所說的六識不死不生或由有分或由反緣而死由異熟意識界而生解脫道論也有類似的文證此不死不生的六識不是眼耳鼻舌身意六識是眼等五種根識與意界銅鍱者是一意識師以意識為精神的根本五識僅是認識外境的見用意界是五識若前後次第生識所以五識與意界六識是不配作初生命終心的三有根本的有分心是意識中內在的貫通者解脫道論用國王來比喻它它在業感成熟彼事心以後最初托生即是異熟主體的意識有分也可說是三有之因但死時自有在一般意識活動完全休止歸到有分心而死的也有在反緣而流返有分的過程中彼事心就死了的以彼事心而死或是卒然而死的在人類卒死時常有一生的經歷突然浮現在心上而後死的銅鍱者的以意識為本與意界是常論者的以意界為本雖有多少不同但它在一般知意的內在指出一如牽縷的貫通三世心那就可見它與唯識的本識是如何的接近了第六項細意識上座分別論者還有建立粗細二意並生的如成唯識論卷三說有餘部執生死等位別有一類微細意識行相所緣俱不可了這餘部是上座部據成唯識論述記卷四的解說上座部有本末二計本計粗意識與細意識可以同時生起末計卻主張粗細二意不能同時粗細並起的見解已進入七心論的領域不再是六識論所能範圍的了二意別起論者在六七識論的分界線上還有進退的餘地七心論者的難題在說明細心的所依所緣與行相現在這一派上座學者爽直的提出了所緣行相俱不可了的主張這到後代的大乘唯識學裡雖在說細心的根境行相但所緣行相俱不可了的意見一直被採用著依論文來說這細心的作用表現在初生與命終的階段到底平時有沒有細心卻沒有說到如依道邑成唯識論義蘊的解說這細意識不但是受生命終心還是以後諸法生起的所依它是緣根身和器界的這樣與唯識學上的本識簡直到了不易辨認的地步第五節大眾系與本識思想第一項大眾系的特色大眾部是根本二部的一部四大派的一派在大乘佛教思想的開展上它有極大的勛績它雖是小乘部派之一但不像薩婆多部那樣的固拒大乘它是不妨兼學大乘甚至密咒的在大眾部所傳的增一阿含經裡已有菩薩藏結集的記載它最先承認了大乘的正確性在小乘方面它也有經律論蜫勒三藏但像義淨所見的論典似乎是後出的在中國除分別功德論以外沒有其它論典的傳譯因此考察大眾系的思想有一極大的困難就是它的思想只能從大毘婆沙論等敵對者的口中間接介紹出來沒法從它自宗的論典裡去發見它思想的全貌大眾系論典傳譯得很少這決不是譯者的有意歧視大眾系的學者具有超越的想像力不重在名相繁瑣的知識它不需要阿毘達磨式的論典它不想造成表現自己的學派願意把自己化在一切中共一切存在而存在所以它的思想表現不在論典而在另一姿態之下這實在不過是印度婆羅門文化的特色從大眾系思想的大勢來看它是佛陀中心論者深化了佛陀的功德不像有部它們以阿羅漢作中心它標揭了心性本淨說展開了聖道真常的妙有論雖沒有多量的論典卻有異常龐大的典籍開顯這佛陀中心論與真常妙有心性本淨的思想就是在唯識學的體系中誰是多心並起論者誰是最初的熏習論者誰是根識思想的先進者不消說這都是屬於大眾部的在大眾系發揚皇厲的時代從上座系中分離出來的有部犢子部還在萌芽的時代對於大眾系在佛教思想的開拓上我感到它的偉大我想大乘唯識學者是決不該忽略它的第二項遍依根身的細意識大眾系的心識觀最初也是一心相續的六識論它容許有無心的有情嗎窺基在成唯識論述記卷五說大眾經部等解如常施食受樂非謂一切時有染污意名恒大毘婆沙論卷一九說大眾部主張唯心心所有異熟因及異熟果可知大眾部的業果相續很早就建立在心法上的容許無心的有情等於容許無業無果的有情這是不可想像的大毘婆沙論卷一五二說譬喻分別論者說無有有情而無色者亦無有定而無心者這無色界有色本是大眾部特有的教義無心定有心我認為是大眾與譬喻分別論者共同的見解異部宗輪論說大眾部末宗異義有主張有於一時二心俱起的這二心俱生還不過是六識並起但細意識的思想異部宗輪論也確已提到它說心遍於身窺基異部宗輪論述記說即細意識遍依身住觸手刺足俱能覺受故知細意識遍住於身非一剎那能次第覺定知細意遍住身中心遍依身的思想是從執受而推論得來執受就是說把它作為自我的一體屬於生命的機動體而不是世界的這所執受的是根身能執受者是心因心的執取根身才成為生動的有機體能因外境的接觸而立刻引起反應感覺我們一期生命的延續生與崩潰死也就在此我們觸手刺足不論刺激那一部分那一部分就能引起感覺這可以證明有心在執受著心若一旦不起根身再也不能有所感覺所以大眾末計的細心執受就是生命的象徵一切感覺的來源刺激多方面或者全身就能引起全身的感受因此證明心識是普遍的執受著不然也就不能同時生起多方面的感受了大眾部的執受心是常在而有演變的在不息的變化中適應眾生身量的大小而大小這遍依於身的心無時不在而六識卻是起滅間斷的所以遍依根身的執受心必然是細意識這遍依於身的細心不但與大乘唯識學上的本識執受根身有關就是對藏識之所以為藏也有直接的關係第三項生起六識的根本識大眾部的根本識是六識生起的所依無著論師在攝大乘論裡早就把它看成阿賴耶識的異名論上說於大眾部阿笈摩中亦以異門密意說此名根本識如樹依根世親攝大乘論釋卷三作了簡單的解說謂根本識為一切識根本因故譬如樹根莖等總因若離其根莖等無有如樹依根的依世親解釋做諸識的根本因護法成唯識論卷三說是眼等識所依止故有人望文生義說世親是約種子作親因說的護法是約賴耶現行作六識俱有依說的其實大眾部並不如此世親也是從現行的細心而說像世親三十唯識論說的依止根本識五識隨緣現幾曾有種識的意味這生起六識的細心像樹莖樹枝所依的樹根一樣在這裡見到了本識思想的源泉也見到了本識名字的成立解深密經的阿陀那識楞伽阿跋多羅寶經的一切根識都是直接從這根本識演化而出本識思想的成立雖說與上面所敘述的真我細蘊細心都有關係雖可說是這些思想共同要求的合流但比較主要的要算大眾部的根本識分別論者的一心經部的集起心它們在建立的目的及說明上各有它的側重點而根本識的重心在說明心理活動的源泉根本識與大眾系末宗異義的細意識只是一體的兩面應該把它綜合起來考察這要從六根說起五色根佛弟子間有兩個不同的看法薩婆多它們說眼等五根是微妙不可見的色法根的作用是攝取外界的相貌因色根取境的功能才能引起眼等五識識的作用是了別還有大眾部它們說眼等只是血肉的結合它根本沒有見色聞聲的功能見色聞聲的是五識大眾系既沒有把引發精神活動的能力給予五根五根只是肉團那麼對於根身靈活的感應與所以不同非眾生的色法自然要給以其他的解說這當然是意根了談到意根各方面的意見更龐雜上座系的銅鍱部說意根就是肉團心就是心臟它把意根看成了物質的其它學派一致把它看做心法這當然要比較正確得多佛說十二處總攝一切法如果把意處的意根看成色法那一切心心所法又攝在那一處呢在意根是心的意見裡又有過去心與現在心兩派說一切有系是主張過去心的它們不許二心同時現起不許六識外別有細心所以說剎那過去的六識能引起後念的六識叫意根但意界是常論者和大眾部是在六識以外建立一個恒存的細心這細心有生起六識的功能意根在十八界裡屬於意界無間滅意論者雖巧妙的解釋了意界與六識界的差別事實上並不能顯出意界有什麼特性依中阿含嗏啼經看來意根不但是意識也是五識生起的所依凡是論到六識的生起是不能離卻意根的大眾末計的心依於身說明了因心的執取五根才能遍身生起覺受執持根身而起覺受與五識的是否生起無關與識上的苦受樂受也不同像入定或熟睡的時候雖然不起五識與相應受但出定與醒覺以後我們還感有一種怡悅或勞頓的領受假使熟睡時沒有任何身體上的感覺那醒後的身識與意識也不該有因熟睡而生勞倦之感這就是細心執受的明證依大眾部的見解眼不見色耳不聞聲五根只是肉團細心執持肉體才能起覺受生六識總之大眾部的細心說是遍藏在根身之內而無所不在它與根身有密切的關係眾生與非眾生生存與死亡的分野都在這裡認識作用的六識也從它而起細心的覺受是生命的表象是微細的心理活動唯識學上的本識本來著重在生命緣起在生命依持與現起六識的作用上湧出了深祕的本識思想後代的大乘唯識學者雖也片段的敘述到這些而把重心移到另一方面不過我們應該知道細心的存在是不能在持種受熏上得到證明的第三章種習論探源第一節種習思想概說種子與習氣是唯識學上的要題它與細心合流奠定了唯識學的根基探索生命的本質發現了遍通三世的細心尋求諸法生起的原因出現了種子與習氣種習與細心有它的共同點就是從粗顯到微細從顯現到潛在從間斷到相續在這些上兩者完全一致化地部的窮生死蘊是一個很好的例子但種習的目的是要成為一切法生起的功能它需要的性質是差別變化細心的目的在作為雜染清淨的所依性這自然需要統一固定在這點上細心與種習無疑是截然不同的種習本來不一定要與細心結合像經部的根身持種但在諸法種子之所集起故名為心的經文啟示下種子與細心就很自然而合法的結合起來不過統一與差別轉變與固定這不同的特性再也無法融成一體而理論上又決不能讓它對立於是細心與種子的關係規定為不一不異種是種子習是習氣或熏習大乘唯識學裡特別採用這個名詞但在部派佛教裡隨界不失有各式各樣的名稱起初這些都是從各種不同要求下產生後來才漸漸的綜合起來它們共同的要求是在某一法沒有現起作用時早已存在一旦因緣和合就會從潛在的能力轉化為現實薩婆多部依現實的存在推論到未來世中已有色心一切法的存在也可說是種子思想的表現但它是三世實有論者只見過去過去卻不能轉化過去的在新的形式下再現它與種習思想不能說無關但到底是很疏遠的這種習思想與過未無體說有密切關係未來是無就不能像有部那樣把一切法的因體存在未來業力等剎那滅去不能說等於沒有過去既然無體也就不能把它放在過去這樣不論它有沒有建立種子與習氣這些潛力的保存總得安放在現在在現在的那裡呢在生命緣起為中心的佛法是必然要把它攝屬到有情身上有的說依根身色有的說依心結果種習與細心的結合成了唯識學者的公論種子與習氣都是根據比喻而來豆麥都是種子種子雖需要其它適當的條件才能抽芽發葉開花結果但豆葉豆花與麥葉麥花的差別主要的是種子水土等條件雖說能引起相當的變化但究竟微乎其微種子不但有生起的功能並且生起的結果還和它同類生起諸法的功能叫它做種子就是採取這個意義後代的唯識學者把種子演化貫通到異類因果其實種子的本義在同類因果習氣就是熏習的餘氣像一張白紙本沒有香氣和黃色把它放在香爐上一熏白紙就染上了檀香和黃色這個熏染的過程叫熏習紙上的香氣和黃色就是習氣後代也叫它為熏習熏習的本義是甲受了乙外鑠的熏染甲起了限度內不失本性的變化這雖是甲乙發生關係的結果但甲是被動的主體乙是主動的客體關係不是相互的種子阿含經早有明文像識種心種五種子各派都承認它是佛說解說有出入像大乘唯識學的種子說原始佛教是沒有的這要經過學派的辨析要有部異師與經部合作才積極的發達起來所以一直到了大乘教中還充滿有部系的色彩習氣本不是能生諸法的功能它與煩惱有關與覆染本淨的思想相互結合習氣的本義是說受了某一法的影響影響到本身本身現起某一法的傾向與色彩它被看為顛倒錯亂現象的動因種子與習氣經歷了錯綜的演變往往化合成一體的異名大乘唯識學裡這兩者的差別性已沒有絕對的分野但親生自果與受染亂現的思想仍然存在並且演出了各別的學派這一點我們應該深切的注意才好第二節微細潛在的煩惱第一項隨眠一總說在部派佛教裡隨眠被爭論著爭論它是不是心相應行心所其實問題的重心卻另有所在眾生的不得解脫生死原因在煩惱未斷煩惱是特殊的心理作用它在心上現起時能使心煩動惱亂現在未來都得不到安靜斷了煩惱才能畢故不造新不再感受生死苦果我們不也常起善心嗎在煩惱不起的時候為什麼還是凡夫不是聖人雖然有人高唱一念清淨一念佛事實上我們還要生起煩惱過去煩惱的勢力還在支配我們這一念善心不同聖者的善心還充滿雜染的黑影這樣就要考慮到過去煩惱勢力的潛在未來煩惱生起的功能在這點上微細的相續的潛在的隨眠就被佛弟子在經中發現心不相應的隨眠論者與反對派的相應論者引起了很大的辨論後來又引出其它的見解隨眠問題是更複雜化了把各家的見解總攝起來是這樣的一切有系犢子系分別說系大眾系有部經部成實論師正統派法救心相應行非心相應行非心不相應行亦心相應行亦不相應行心不相應行二有部的心相應行說薩婆多部的見解未來還要生起煩惱這是因為煩惱沒有得到非擇滅過去的煩惱因有不相應的得的力量使煩惱屬於有情沒有和它脫離關係在這樣的思想下過去煩惱的勢力或能生煩惱的功能老實說用不著它有了三世實有再加上得和非得凡聖縛解的差別就可以建立若有一類非於多時為欲貪纏纏心而住設心暫爾起欲貪纏尋如實知出離方便彼由此故於欲貪纏能正遣除并隨眠斷依經典轉引俱舍論卷一九的明文很可以看出纏和隨眠的分別起欲貪纏為欲貪纏纏心而住纏是煩惱的現起而與心相應的此外別有隨眠除有部以外一切學派都把它看成與現纏不同唯有有部學者認為隨眠是纏的異名也是與心相應的心所像俱舍論卷一九說毘婆沙師作如是說欲貪等體即是隨眠豈不違經無違經失并隨眠者并隨縛故或經於得假說隨眠如火等中立苦等想阿毘達磨依實相說即諸煩惱說名隨眠由此隨眠是相應法何理為證知定相應以諸隨眠染惱心故覆障心故能違善故它用或設劬勞為遮彼起而數現起的隨縛義謂能起得恒隨有情常為過患的恒隨義解釋隨眠以阿毘達磨者自宗的正理判佛說為假說不過它用三個定義證明隨眠是心相應行在其它的學派看來這都不成為隨眠的作用三大眾分別說系的心不相應說大眾系分別說系一致以隨眠為心不相應行與纏不同異部宗輪論說隨眠非心非心所法亦無所緣隨眠異纏纏異隨眠應說隨眠與心不相應纏與心相應要理解大眾分別說系的隨眠應記得它是心性本淨論者它怎樣重視性淨塵染的思想真諦譯的隨相論有關於隨眠的解釋如僧祇即大眾等部說眾生心性本淨客塵所污淨即是三善根眾生無始已來有客塵即是煩惱煩惱即是隨眠等煩惱隨眠煩惱即是三不善根由有三不善根故起貪瞋等不善不善生時與三不善根相扶故言相應覆障淨心的客塵就是隨眠它說隨眠是三不善根但奘門的傳說見成唯識論義蘊卷二隨眠與纏一樣也有十種據順正理論卷四六的記載分別論者的隨眠只許七種或許分別論者立七隨眠大眾部等以三不善根為隨眠吧總之在凡夫位上隨眠是從來不相離的因隨眠生起貪等不善心所才是相應它把相應解釋做與不善根相扶依一般共同的見解應該是說心所與心相應眾生的心性本淨又沒有貪等煩惱現起然而還是凡夫不是聖人歸根是隨眠在作障這依隨眠的存在分別凡聖的界線窺基的異部宗輪論述記與智周的成唯識論演祕都曾經說到但說到無心定是完全錯誤了異部宗輪論述記說在無心位起善等時名異生等但由隨眠恒在身故若是心所無心等位應是聖人大眾系與分別說系根本不許有無心的有情怎麼依無心有惑的見解來成立隨眠是不相應呢大眾部的見解不思不覺間也有隨眠存在見順正理論卷四五它不像相應心所的纏要在心識活動中出現它雖不與心相應卻也展開它的黑影影響那清淨的心性使它成為有漏隨眠與纏確是種子現行的關係如大毘婆沙論卷六說纏從隨眠生順正理論卷四五也說且分別論執隨眠體是不相應可少有用彼宗非撥過去未來勿煩惱生無有因故這都是隨眠生纏的明證成唯識論義蘊卷二也有詳細的引述問大眾部隨眠為是種不答俱舍十九牒彼計云若執煩惱別有隨眠心不相應名煩惱種此中復說名貪等故如現貪等若不對種何名現貪故知此師隨眠是種現行貪等與心相應故此隨眠名不相應隨眠是現行貪等種子可說毫無疑問但勿以為它是種子就輕視它的力量它雖沒有積極的活動到精神界去它在不生現行的時候還是染污淨心的隨眠比較心性雖說是客塵但無始以來就有隨眠也該是本有的我們進一步要問現起煩惱有沒有增長隨眠的力量換句話說隨眠有沒有新熏的玄奘門下傳說的大眾分別說系彼許種子而無熏習成唯識論學記卷四破大眾部然彼無熏習義成唯識論述記卷四但考尋論典它們確是有熏習的像成實論卷三說汝法中雖說心不相應使使是隨眠的異譯與心相應結纏作因汝法中雖說久習結纏則名為使久習結纏則名為使可說是熏習最明顯的證據它的熏習論後面還要說成實論主自宗主張是垢心纏修集則名為使見成實論卷九與久習結纏則名為使相近但成實論宗是在煩惱相續展轉增盛的意義上建立隨眠還是現行的心法不像不相應行的隨眠論者建立在心心所法以外大眾系他們發現了煩惱的潛在力這或是本具或是新熏的最初展開了種子生現行現行熏種子的思想但一般人的見解要發生疑問煩惱有種子其它一切法為什麼沒有呢成實論主曾這樣的責問過論卷三身口等業亦有久習相是亦應有似使心不相應行俱舍論主也曾責難過論卷一九若執煩惱別有隨眠心不相應名煩惱種應許念種非但功能別有不相應能引生後念此既不爾彼云何然這確乎是很費解的現存參考的資料既不完全我們也無從作適當的解說不過在佛家業感的緣起論裡是否色法也要各從自種生煩惱的潛能是隨眠業是動力大眾部各派都不許它是色性把它建立在內心的活動上這內心的活動至少大眾部是承認有熏習的明淨的心性在相續的演化下成為無漏和善法的根據惑業的能力遇相當的現緣招感一切色法這要不要業力以外的種子還值得注意怕由心所生的論調大眾部它們還是非常徹底的呢四犢子系的亦心相應亦心不相應說隨眠不是心所法這似乎是佛的本意不但有經文的明證就是從學派上看也只有部系才主張隨眠即纏有部系中除迦旃延尼子派以外像譬喻經部師大德法救見大毘婆沙論卷五一也都主張纏和隨眠不同不過這要在過未無體的思想下才會感到隨眠潛在的需要犢子系是三世實有論者它也建立了得不知怎樣解釋不相應行隨眠的作用這難怪要受眾賢的批評了順正理論卷四五說然犢子部信有去來執有隨眠非相應法如是所執極為無用如彼論言諸欲貪纏一切皆是欲貪隨眠有欲貪隨眠非欲貪纏謂不相應欲貪隨眠依犢子系的見解隨眠是一切煩惱的總名其中心相應的一分又叫做纏還有那不相應行的一分與纏不同它多少調和了隨眠的諍論經部非相應非不相應的隨眠說留到下面去再談第二項習氣習氣熏習習地即住地在大乘教學上廣泛的應用著瑜伽派雖還保存煩惱氣分的習氣但它繼承經部的思想已把熏習應用到一切法上從釋尊本教上看習氣就是煩惱的氣分此外好像沒有什麼習氣習氣的有無是佛與二乘斷障的差別像大智度論卷二說阿羅漢辟支佛雖破三毒氣分不盡譬如香在器中香雖去餘氣故在又如草木薪火燒煙出炭灰不盡火力薄故佛三毒永盡無餘譬如劫盡火燒須彌山一切地都盡無煙無炭如舍利弗瞋恚餘習難陀婬欲餘習畢陵伽婆蹉慢餘習譬如人被鎖初脫時行猶不便佛是煩惱習氣都盡了的聲聞獨覺還剩有餘習這煩惱氣分的餘習就是無始以來一切煩惱的慣習性煩惱雖已斷卻但習氣還在身體言語意識上不自覺的流露出來像舍利弗的心堅畢陵伽婆蹉的喊人小婢它雖是煩惱氣分但並不是偏於心理的習氣的體性可以暫且勿論重要的問題是小乘有沒有斷習氣大天的羅漢為餘所誘猶有無知亦有猶豫都是習氣之一大眾系等主張羅漢有無知有猶疑薩婆多部等主張雖斷而猶現行這在部派分裂上是一個著名的諍論據有部大毘婆沙論卷九九的傳說大天不正思惟在夢裡遺了精說是天魔的嬈亂他給弟子們授記說他們是羅漢弟子們自覺沒有自證智還有疑惑大天卻說這是不染無知處非處疑據真諦記的解說這都有真有假羅漢確乎可以受天魔的嬈亂確乎有不染無知與處非處疑但大天和弟子都不是羅漢所以是假的他們對初事的見解是同的後二事就有很大的出入真諦怪他的弟子不是羅漢這也不致引起教理上的糾紛大毘婆沙論說他毀謗羅漢沒有自證智還有疑惑聖者證果而沒有自覺與證信在後代佛教思想上沒有這種痕跡居於大眾系領導地位的大天也不致那樣荒唐事實上這是不染無知處非處疑阿羅漢有沒有斷的諍論羅漢有無知有疑惑這是指出了羅漢功德上的缺點在以羅漢為究竟的上座面前簡直等於誣辱這才引起了嚴重的糾紛促成部派的分裂大天也被反對者描寫成惡魔大天的呼聲震醒了全體佛教界獲得了新的認識從狹隘的羅漢中心論裡解放出來羅漢的無知未斷還有它要做的事才回小向大大乘不共境行果的新天地都在羅漢不斷餘習的光明下發現大天的不淨漏失不染無知處非處疑本來都是習氣但有部特別擴大了不染無知使它與習氣有同樣的意義在大毘婆沙論卷一六所說的習氣卷九所說的不染污邪智也在說佛陀畢竟永斷聲聞獨覺還有現行順正理論卷二八對不染無知提出兩個大同小異的解說一不染污無知是於彼味等境中數習於解無堪能智此所引劣智名不染無知即此俱生心心所法總名習氣這是說習氣是有漏劣慧與它俱生的心心所法二是所有無染心及相續由諸煩惱間雜所熏有能順生煩惱氣分故諸無染心及眷屬似彼行相差別而生這是說習氣是有漏劣智和同時的身心相續依順正理論主的見解煩惱引起不染無知是非常複雜的一切聖者雖都已經斷盡但有行與不行的差別如解脫障體也是劣無知慧解脫羅漢還要現行像順正理論卷七說何等名為解脫障體諸阿羅漢心已解脫而更求解脫為解脫彼障謂於所障諸解脫中有劣無知無覆無記性能障解脫是解脫障體於彼彼界得離染時雖已無餘斷而起解脫彼不行時方名解脫彼又像學無學的練根也是為了遮遣見修斷惑力所引發無覆無記無知現行可知退法等五種種性雖是無學也還有不染無知現前眾賢一貫的意見斷是斷了行或者還要行不過習氣與不染無知有部的古師也有主張不斷的像大毘婆沙論卷一六說有餘師說阿羅漢等亦現行癡不染無知猶未斷故這明顯的說不染無知不斷所以有現行的愚癡與雖斷而猶現行的意見截然不同檢討唯識學的種子思想為什麼要談到習氣與不染無知呢一習氣在一分唯識學裡被看為與種子共同的東西那麼習氣的本義也是需要認識的二在大乘教學裡習氣與隨眠漸漸的融合起來從隨眠的心不相應走上習氣習地的心不相應習煩惱與起煩惱有的等於隨眠與纏有的等於煩惱與習氣而小乘有沒有斷習也就成了可討論的問題三心性本淨無始以來習氣所染成了唯識學上普遍而極根本的問題習氣已替代隨眠成為客塵的本質這樣唯識思想的探求者自然有加以理解的必要第三項阿賴耶第八識雖有很多的名稱阿賴耶要算最主要的了阿賴耶在初期的佛教界並沒有被認為細心它是以著的資格出現的它在唯識學上佔有這樣的地位當然在它名詞的本身有被人認為細心的可能阿賴耶定義的不同也是後代唯識學分歧的地方我們需要虛心的去認識它無著論師在攝大乘論卷上說聲聞乘中亦以異門密意已說阿賴耶識如彼增一阿笈摩說世間眾生愛阿賴耶樂阿賴耶欣阿賴耶喜阿賴耶於聲聞乘如來出現四德經中由此異門密意已顯阿賴耶這裡說的增一阿含經無性說它是一切有部的現存的漢譯增一阿含經並沒有這如來出現四德經這也可見印度小乘經典彼此的不同了在律部中佛起初不想說法原因就是眾生樂阿賴耶等銅鍱部經律作三阿賴耶阿賴耶為眾生不易解脫的癥結所在阿賴耶是什麼攝大乘論提出了五取蘊貪俱樂受薩迦耶見三說梁譯的世親攝大乘論釋卷二又提出了壽命道六塵見及塵四說成唯識論又加上五欲轉識等色身究竟有部有這般異說呢還是論師的假敘呢這都沒什麼重要阿賴耶究竟是什麼意義倒是值得檢討的唯識學裡阿賴耶有多樣的解釋比較共同而更適當的是家宅窟宅依處唐玄奘旁翻做藏也還相當的親切根據各種譯典去領會阿賴耶的含義可以分為攝藏隱藏執藏但這是同一意義多方面的看法這可以舉一個比喻一張吸水紙吸飽了墨汁紙也變成了黑紙在這紙墨的結合上可以充分表顯賴耶的含義像紙能攝取墨汁紙是能攝藏也就是墨汁所攝藏的地方無著論師的賴耶有能藏所藏義就是這攝藏的能主動所被動兩面的解釋這攝藏的要義是依又像紙吸了墨汁墨色就隱覆了紙的本相紙的本相也就潛藏在一片黑色的底裡這就是隱藏的能所兩面觀了一分唯識學者忽略了這一點結果不要說楞伽阿跋多羅寶經就是看為最重要依據的解深密經裡的阿賴耶的定義也被遺棄這隱藏的要點是潛又像墨汁固然滲透到紙的全身紙也有它的吸引力這就是執藏的能所兩面觀它的要義是係著一分唯識學者但取了賴耶的被執著忽略它本身的執取力它們好像賴耶是沒有能執著的作用一樣其實不然像俱舍論卷一六引經說汝為因此起欲起貪起親起愛起阿賴耶起尼延底起耽著不阿賴耶有能著的意義經文是何等明顯增一阿含經所說的阿賴耶有部學者也有說它是薩迦耶見是見也是在說明它的能取能著如阿賴耶沒有被解為能取能著的可能那這些學者簡直是胡說了要知道一字作能所兩面的解釋不但有能藏所藏作前例也是文字上普遍的現象阿賴耶的本義是著但一經引申就具有廣泛的含義它比阿陀那毗播迦心意識更能適應細心多種多樣的性質它也就自然被人採用作細心最正規的名字阿賴耶是近於愛欲的煩惱本與種習沒有必然的關係但因它與本識有關在這微細的煩惱中附帶的加以說明第三節業力的存在第一項概說業力是佛法中最主要的論題眾生種種的差別獲得自身行為應得的結果都建立在業力上初期的佛教因業力已普遍的受人信仰所以多說明業力的必然受果與業用的差別對於業力的體性與怎樣存在反而很少解說佛弟子在自行化他的要求上不能不討論業的體性與怎樣的存在業力也就理論化展開了各家各派的解說一直到現在業力還需要深刻的研究它的因果異熟必然性還需要再確立業雖剎那間過去而招感後果的力用還是存在這業力的存在是身口行為所引起的是生起後果的功能業力的存在就是動力的存在在這些上它與種子或熏習比細煩惱與種習的關係更密切可以說業力生來就含有種子的意味我們只要稍微考察一下各派關於業力存在的說明就很容易看出它是怎樣的向種子說前進像楞伽阿跋多羅寶經的業相與心能積集業的業簡直就是種子的異名要研究種習是不能忽略業力的第二項各派對業力存在的異說一薩婆多部的無表色薩婆多部的見解業有身口意三種意業是思心所因思心所所發動引生的形色言語叫做身表和語表這都是色法身表與語表業剎那引起另一種不可表示沒有對礙的色法叫無表色就是無表業依欲界說這無表色是從四大所造也有善與不善兩類無表色的教證雖然很多但主要是業力的相續增長身表語表是剎那滅而間斷的意業也是三性不定的但業力卻是相續的像經上說轉引俱舍論卷一三成就有依七福業事若行若住若寐若覺恒時相續福業漸增福業續起這可以看出有某一類法業力在相續如流佛曾說過無表色雖然各家的解說不同但因表色而引起的潛在業力稱為無表色確也非常適宜二經部的思種子從有部流出的經部譬喻師對業力的見解和有部不同大毘婆沙論卷一二二說譬喻者說表無表業無實體性身表語表與無表色它都認為不是真實的形色是依顯色的積聚而假立的能詮的語聲一剎那不能詮表多剎那相續也就不是實有無表色是依過去大種施設然過去大種體非有故也不是實有它雖承認表無表色的名稱卻不許它是業的實體那麼業是什麼呢大毘婆沙論卷一一三說譬喻者說身語意業皆是一思大毘婆沙論卷一九的離思無異熟因也是這個意義俱舍論卷一三順正理論卷三四都有譬喻者的業力說大意說考慮決定時的思惟思是意業因思惟思而引起的作事思能發動身體的運動言語的詮表這動身發語的作事思是身業與語業身體的運動與言語的詮表只是思業作事所依的工具這還在三業方面說談到無表業譬喻論者只說成就後代經部說是因思心所的熏習而微細相續漸漸轉變簡單的說無表業是微細潛在相續的思種子它與有部對立起來有部說是無表色它卻說是種子思三成實論的無作業從經部流出而折衷大眾分別說系的成實論它的三業說與經部沒多大出入無表業卻有不同的見地成實論卷七說從重業所集名無作無表常相續生故知意業亦有無作何法名無作答曰因心生罪福睡眠悶等是時常生是名無作意無戒律儀所以者何若人在不善無記心若無心亦名持戒故知爾時有無作不善律儀亦如是問曰已知有無作法非心今為是色為是不相應行答曰是行陰所攝色聲香味觸五法非罪福性故又或但從意生無作是無作云何名色性有無色中亦有無作無色中云何當有色耶它說意業也有無表它否認無表業是色法主要是因為無色界中也有無表業存在心是那樣忽善忽惡忽有忽無的又怎能說業力是心呢因此它把無表業攝在不相應行中成實論主雖建立了潛在的業力但對其它的色法心法沒有像經部那樣建立種子這點與大乘成業論所說的不失增長論者的意見相近大乘成業論說由善不善身語二業蘊相續中引別法起其體實有心不相應行蘊所攝有說此法名為增長有說此法名不失壞由此法故能得當來愛非愛果不失與增長順正理論卷一二三四五一雖都把它看為與種子異名同實的東西但依大乘成業論看來也還是局限在業力方面與成實論師一樣四大眾分別說系的成就與曾有大眾部他們的意見無表色既不是業也不是瑜伽師所說的定自在色成唯識論述記卷二說若大眾法密部別立無表色謂身勇身精進若心勇等心所攝上座胸中色物亦法處攝他們既不許無表色是潛在的業力那怎樣解說業力的存在呢大毘婆沙論卷一九說或復有執唯心心所有異熟因及異熟果如大眾部招感異熟果的業因大眾部規定為心心所的功能大眾部的潛在的業力建立在心心所法上是可以推想而知它與譬喻者的離思無異熟因離受無異熟果都把業因業果歸結到心上這實在是唯識思想一個重要的開展但大眾的唯心心所有異熟因及異熟果或許是比較後起的在相傳目犍連子帝須所撰的論事裡大眾部主張聲是異熟果六處是異熟果就和大毘婆沙論的唯心心所有異熟果不同它與正量部同樣主張表色是戒戒非心法戒得後自增長但大眾的相續不失招感異熟的業力並不就是表色這不但大眾系如此化地分別說系正量也都是這樣論事說正量部與化地部和大眾末派的案達羅學派都說身語表色是善不善性正量化地又說身語表色同能引思有善不善性表色是戒善或惡因表色引起與思相應的善不善心心所方是善業和惡業但這還是現行的不是潛在的像隨相論說正量部戒善生此善業與無失法俱生業體生即謝滅無失法不滅善是心相應法故生而即滅無失法非心相應法故不念念滅大眾分別說系雖沒有像正量部那樣的建立不失法但它善惡業剎那過去業力也並不消失這叫曾有成就大眾分別說系是過未無體論者它說過去的業是曾經現有的東西它雖滅了卻成就在眾生的相續中意思說眾生沒有離卻這業力的影響但過去所造的業不能說它還是現實的這等於說過去的善惡業轉化為潛力的存在不離眾生的身心相續中在種子思想沒有被明確揭示出來以前二世過未無的學者都用這個理論建立前後因果的關係成實論卷二二世無家說是業雖滅而能與果作因不言定知知過去業如字在紙罪業亦爾以此身造業是業雖滅果報不失他們明白的表示過去業是滅了不能說它實有業與身心相續的關係像記載事件在紙上一樣事件雖然過去檢閱簿藉以及券約作事者依然負有券約上的義務這樣業雖然滅去但此身心相續還受有過去業力的影響還能引起未來的果報二世無者的如字在紙與正量部的不失法是同樣思想的產物經部的種子說說明上比較進步些內容也還是相同不過所取的譬喻不同一個是如字在紙一個是如種生果在比較研究所得的結論種子說是二世無的必然結論曾有與成就中論業品疏曾說僧祇曇無德法藏譬喻明現在業謝過去體是無而有曾有義是故得果曾有是說它曾經是現實的成就是說它現在還有關係還有它力量的存在成就與得相近但二世無家沒有把成就看成別有一物譬喻者依眾生不離是法而假立的曇無德部說心不離是法那在建立成就的意見上也有依眾生依心的二派五正量部的不失法三世實有者沒有考慮業力怎樣存在的必要因為滅入過去業還是存在的他們要討論的是業入過去以後怎樣與有情身心相續發生連繫因了係屬有情的要求建立了心不相應行的得薩婆多和犢子系都是這樣的但一經研求一一法有一一法的得得也還有得它的得得法前法後法俱成為最瑣碎最困難的論題業力因了得的力量總算在沒有感果業得未離以前還是屬於有情正量部在得以外又建立了一個不失法它用債券作比喻像顯識論說正量部名為無失譬如券約故佛說頌諸業不失無數劫中至聚集時與眾生報正量部的不失法與得在顯識論裡是被看作種子的正量部的二十二明了論也認為得與不失有同樣的意義凡是攝屬有情的一切法都有得但不失法卻只限在業力方面善惡業生起的時候就有得與不失法跟著同起得的作用在係屬有情不失卻是業力變形的存在這樣不失法與有部的無表色經部的思種子意義上非常的接近正量部主張表色是戒沒有建立無表業在它的意見表色引生善惡業業剎那過去而還有感得未來果報的力量這就是不失法不失法與善惡業同時生起但不像業體的剎那滅要到感果以後才消失如隨相論說業體生即謝滅無失不失法不滅攝業果令不失無失法非念念滅法是待時滅法其有暫住義待果生時其體方謝不失法的暫住不滅依真諦三藏說是功用常待果起方滅中間無念念滅出中論業品疏這點與無表色種子思都不相同不失法雖與業俱生並且是攝業果令不失但它本身不是業不是善惡是心不相應行的無記法它只是業力存在的符號中論卷三曾敘述不失法而加以批評說不失法如券業如負財物此性則無記分別有四種見諦所不斷但思惟所斷以是不失法諸業有果報依明了論的解說這無記是自性無記它不是善惡與唯識學的種子是無記性也有共同的趨向分別有四種青目釋為三界繫及不繫假使不失法是通於無漏不繫的應該不單是思惟所斷還有一分是不斷的正量學者不致於有這樣粗淺的矛盾隨相論也明白的說若無漏善不能得果無有無失法與善俱生但思惟斷但三界繫是確然明白無可猶疑的分別有四種怕不是繫與不繫吧第三項結說把上面所說的總結起來看無表色種子思無作業增長不失曾有這一切一切都在說身語動作以外引起業力的存在這存在是微細而潛在的相續不斷的未來的果報是由它引起的不論它名稱是不是種子已一律具有種子或熏習的含義不過種子攝藏在細心裡這要到大眾分別說譬喻它們才有這種傾向因為業力的存在就在眾生的心中關於業力存在的體性有部是無見無對的色法經部是思上的功能成實正量大眾它們是心不相應行但又有有別體無別體的二派有部把潛在的業力看成色法確有極大的困難色的定義是變壞或變礙無表色對這兩個定義都不見得適合色法的定義本是依據常識的色法而建立的把這定義應用到能力化的細色自然要感到困難這正像一般哲學家的唯心唯物的心物定義往往不是常識的心物一樣經部說業力是思心所的種子雖說它此無別體此不可說異於彼心到底業力沒有能緣覺了的心用不能適合心法的定義這樣還是放在心不相應行裡但非色非心的又是什麼呢我以為潛在的業力是因內心的發動通過身語而表現出來又因這身語的動作影響內心而生起的動能它是心色為緣而起的東西它是心色渾融的能力最適當的名稱是業身表語表是色法因身語而引起的潛在的動能也就不妨叫它無表色至少它是不能離卻色法而出現的不過有部把它看成四大種所造的實色把它局限在色法的圈子裡是多少可以批評的潛在的業力本因思心