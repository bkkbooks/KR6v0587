見地五蘊統一論者要適當些吧但心識在繫縛解脫中佔有主動領導的地位也是不可否認的那麼在從來不斷的心法上建立業果的中樞如不超出他應有的範圍也自有它的卓見可以說五蘊統一論是平等門心識統一論是殊勝門論到怎樣的統一意見又有不同說一切有部在五蘊和合的作用上建立假名我實法各不相關假名我的和合相續才可以說移轉犢子系卻不然它在五蘊不息的演變中發現內在的統一所以立不可說我有部的統一像前浪推後浪的波波相次犢子系卻像在波浪的起伏中指出那海水的統一也可以說一是無機的集合一是有機的統一在心識統一的見地中大眾分別說系的本義似乎沒有明確的論述後來說一切有系的經量部本著有部假名相續的觀點採用了一心論大眾分別說系卻傾向一心是常與意界是常論與經部的一心論對立這兩個思想都有它的困難假名相續的統一是機械的常一的統一是形而上的想像的這兩極端將在大乘佛教的虛妄唯心論與真常唯心論互張旗鼓不論是五蘊或心心所凡作三世統一的說明都與業果緣起有關也就都是本識思想的前驅雖好像補特伽羅與本識無關其實本識是這些思想的合流像唯識學中的阿賴耶與如來藏有密切的關係如來藏與不可說我也有不可分別的地方因此在這本識探源論裡要檢討到補特伽羅也就是要檢討部派佛教所提出的各種所依說第二節犢子系與本識思想諸法無我是佛教的常談小乘學派雖或者有有我論的傾向但敢明白提出有我論的佔有部派佛教重要一席的那要推上座部的犢子系犢子和它的支派正量法上賢胄密林山都建立不可說的補特伽羅補特伽羅意譯為數取趣即不斷的招受五趣生死輪迴的主體本是我的異名今加以不可說的簡別當然非外道的神我可比俱舍論破我品卷三曾談到犢子部所認為非有補特伽羅不可的理由說若定無有補特伽羅為說阿誰流轉生死若一切類我體都無剎那滅心於曾所受久相似境何能憶知若實無我業已滅壞云何復能生未來果成唯識論卷一也有同樣的記載他建立補特伽羅的動機在解說輪迴與解脫的主體業力與經驗的保持這都是出發於業果緣起的解說釋尊也曾談到過我從前如何如何因此犢子系就依這一類的教典建立它的有我論從建立的動機也可以多少知道補特伽羅的任務現在不妨再說得具體些第一補特伽羅是從前世到後世的輪迴主體像異部宗輪論說其犢子部本宗同義諸法若離補特伽羅無從前世轉至後世依補特伽羅可說有移轉犢子部的見解心心所是剎那生滅的色法的根身在相當時間雖不滅而暫時的安住但終於隨一期生命的結束而宣告滅壞就是山河大地充其量也不過暫住一劫這樣有情的身心沒有一法可以從前生移轉到後世在這樣的思想下三世輪迴造業受果等現象當然不能依止那一法來建立這一派的意見認為有一補特伽羅才能貫通三世譬如我造了業這業便與我發生連繫因我的流轉到後世也就可以說業到後世去感果第二補特伽羅是能憶者犢子派的見地曾見曾聞的一切雖然是過去了但還能在我們的心上記憶起並覺得就是我自己所曾經見聞的誰能記憶呢能知的心識剎那剎那的生滅後心既非前心如何可以解釋是我曾見是我曾聞的記憶現象所以他對無我論者提出這樣的詰難如何異心見後異心能憶非天授心曾所見境後祠授心有憶念理見俱舍論這樣他就將記憶的職務請補特伽羅出來擔任大毘婆沙論卷一一曾明白的提到我能記憶的主張犢子部說我許有我可能憶念本所作事先自領納今自憶故第三補特伽羅是六識生起的所依六識是認識對象的知識是無常而有間斷的六識雖然不起但是根身不壞依舊屬於有情所攝誰在作生命的本質呢這樣的觀察無疑的是從知識的現象推論到內在而觸發到生命的本體建立細心的學者用意也大致相同六識間斷時有補特伽羅存在補特伽羅就是六識生起的所依明白點說六識的或起或滅或斷或續都是依止生命的當體補特伽羅才有活動這種思想與印度有我外道是共同的龍樹菩薩的大智度論卷三六曾說到外道的依我生識大乘成業論也說我體實有與六識身為所依止這雖沒有明說是犢子系的主張但在該論破斥的時候曾說又執有我違阿笈摩說一切法皆無有我故既然舉聖教相違來攻難可知這是佛教內部的學者不是犢子系是誰第四補特伽羅能使眼等諸根增長中論觀本住品卷二青目釋說有論師言先未有眼等法應有本住因是本住眼等諸根得增長若無本住身及眼等諸根為因何生而得增長本住也是我的異名因有本住的活動眼等根才能生長這個主張清辨論師的般若燈論卷六說是唯有婆私弗多羅即犢子的梵語立如是義可知這也是犢子部不可說我作用的一種從補特伽羅的作用上去考察就是不談如來藏的唯識學專從瑜伽派的思想來說也就充分的見其一致瑜伽派的本識也在說明它是隨業感果的輪迴主體去後來先作主公因本識的執持熏習才能保存過去的經驗明記不忘本識是六識生起的所依因本識的入胎名色六處等才能增長廣大建立本識的動機和建立不可說我豈不有同樣的意趣嗎難怪有人說阿賴耶是神我的變相犢子部所說的我究竟指的什麼如作皮相的觀察它是避免外道神我論的困難而採取了雙非的論法它常說非假非實非有為非無為非常非無常非即蘊非離蘊只可以說是不可說我這種理論在言語的辯論上是含有困難的成唯識論難他應不可說是我非我也就是找得這個缺點既然一切都不可說為什麼還要說是不可說說是不可說的我呢犢子部分一切為五法藏這我在第五不可說藏之中像成唯識論述記卷一說以下引文多是隨便舉一種彼立五法藏三世無為及不可說彼計此我非常無常不可說是有為無為也它把一切法分成過去法藏未來法藏現在法藏無為法藏不可說藏五法藏三世有為和無為與一切有部的思想大體是相同的只是多一個不可說藏不可說藏就是不可說我有為是無常的無為是常住的而我卻不可說是有為無為是常是無常理由是假使我是無常那從前世到後世的輪迴仍舊建立不起來外道的即蘊計我有斷滅的過失也就在此假使是常住那我應該離卻無常的五蘊而存在同時也就不應該有受苦受樂的差別外道的離蘊計我就有這樣的過失犢子部見到這一點才說非有為非無為雖不就是有為的五蘊卻也不可與五蘊分離而獨存它舉火與薪的比喻不可說薪是火也不可說離薪有火他的雙非論使人很自然的想到有一不離五蘊的形而上的實體這些俱舍論破我品卷二九有較詳細的記述犢子部執有補特伽羅其體與蘊不一不異非我所立補特伽羅如仁所徵實有假有此如世間依薪立火謂非離薪可立有火而薪與火非異非一如是不離蘊立補特伽羅然補特伽羅與蘊非異一五法藏說大般若經也曾談到龍樹菩薩也常用一者有為法二者無為法三者不可說法來總攝一切真空大乘的經論與犢子部的思想是不無關係的在般若性空的體系中不可說法是諸法的真勝義諦畢竟空性有人說犢子系的不可說我是依大般若經的五法藏而建立的但它誤解勝義空性為我了也有人說般若經的五法藏是淵源於犢子部但在說明上比較更深刻更正確不問誰影響誰總之不可說我與般若的勝義空性有關不但與般若有關大涅槃經說如來藏名為佛性佛性就是真我真我不像外道所計的神我所以說無我是不即六法假我與五蘊不離六法的大我這佛性真我與犢子部的不即五蘊不離五蘊的不可說我彼此間關係的密切誰能加以否認呢再把大般若經和大涅槃經綜合起來看般若經雖以不可說藏為勝義空性但勝義空性真常論者不就解說為如來藏實性嗎如從法空所顯的實性去理解中道第一義空與佛性畢竟是一而二二而一的再進一步說不可說我不但與大乘的諸法實性有關我們倘肯聯想到佛說如來藏以為阿賴耶見密嚴經卷下的經文那不可說我與阿賴耶的關係也自然會注意而不忽略的吧第三節說一切有系與本識思想第一項說轉部的勝義補特伽羅異部宗輪論說經量部主張有蘊能從前世移轉到後世所以又稱為說轉部錫蘭的傳說經量部從說轉部流出並不是一派後期的經量與說轉部思想上確有很大的距離我國古德雖說它是一部也分別經部的本計與末計經量本計說轉部初從有部流出是有部與犢子系的折中者也建立勝義補特伽羅末計依譬喻論師所流出的經部時間稍晚大約成立在西元二世紀末它已放棄補特伽羅有轉向分別說系的趨勢經量本計的說轉部立勝義補特伽羅像異部宗輪論說其經量部本宗同義執有勝義補特伽羅勝義補特伽羅僅有這簡略的記載它的真相當然不容易明白異部宗輪論所說它還有一味蘊的教義這應當把它綜合的研究留在下面再說窺基異部宗輪論述記有關於勝義補特伽羅的解說有實法我能從前世轉至後世但是微細難可施設即實我也不同正量等非即蘊離蘊蘊外調然有別體也照這樣說勝義補特伽羅就是諸法真實自體的實法我既不是蘊外別有該是即蘊的吧諸法自體固可以稱為實法我但它是各各差別的是否可以建立為統一性的勝義我呢窺基的解說還有商榷的餘地第二項有部的假名我與犢子系不可說我的關係一切有部也曾談到有我像大毘婆沙論卷九說我有二種一者法我二者補特伽羅我善說法者唯說實有法我法性實有如實見故不名惡見一切有部是依三世實有而得名的據它的解說已生已滅是過去未生未滅是未來已生未滅是現在這三世是依法體的現起引生自果作用和作用的息滅而分別的生滅只是作用的起滅談到法體它是未來存在並不因作用的生起而生起所以說未來法是實有過去同樣的依然存在也不因作用的息滅而消滅所以說過去法是實有依三世實有的見地未來早具足了無量無邊的一切法因現在法引生自果的作用使未來世中的某一類法剎那生起引生自果的作用這叫做從未來來現在現在只有一剎那剎那間作用就要息滅作用息滅以後的法體名為過去法這叫做從現在到過去這好像甲屋住滿了很多的人這些人一個跟一個的經過一條短短的走廊到乙屋去正在經過走廊的時候好比是現在甲屋沒有經過走廊的人好比是未來已經通過走廊進入乙屋去的當然是過去了總之一切有部的三世觀是單就作用的起滅而建立的當諸法正生未滅是現在的存在從現實的存在推論到未生未滅已生已滅的存在建立過去未來的實有所以它常說過去未來法是現在的同類過去未來一樣的也有色聲香等一切法從諸法的自體上看法法都是各各差別常住自性沒有什麼變化可說彼此間也說不上什麼連繫法法各住自性是真實有一切有部依此建立實法我從諸法的現起作用上看每一法的生起必定依前時與同時諸法的力用為緣才能生起生起後又能引生未來法在這前前引生後後成為相似相續的一大串中在這生滅相續而屬於有情的生命之流才有變化彼此間才有連繫一般人不能理解這前前非後後的剎那生滅執著在身心相續中有一個恒常存在的自我這是顛倒的認識生死的根本