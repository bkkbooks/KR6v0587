body:
  text: 上編原始佛教的唯識思想第一章原始佛教思想概說第一節原始佛教界說唯識學的確立雖是西元四世紀的事情但如要從歷史的見地去考察它思想的源泉與發展中的演變那就不能不從原始佛教研究起不然不但不能明白它思想的來源也不能從佛教的立場給予正確的評價佛滅一百年以後佛教才開始顯著的分化一般人稱這分化了的佛教為部派佛教分化以前的佛教為原始佛教原始只是說這一期的佛教在理論上制度上不論那一方面都比較要來得切近佛教的原始態研究原始佛教自然要依據阿含和毘奈耶律關於大乘經有人主張一字一句都是釋尊親口宣說的有人卻否認它說它完全是後人假託的在我看來大乘經有演繹整理的痕跡說它全是後人的假託卻未免有點過火反之現存的小乘經律雖比較接近佛教的原始態但也未嘗沒有相當的變化釋尊依自覺的境地適應眾生的根機用種種方便把它完美的表示出來有的為個人說有的為大眾說也有為諸天說像這樣的經過了四十九年的教化它的遺教景行有誰能把它記得完全無缺呢佛入涅槃以後弟子們頓時失了指導者迦葉們為了要使佛法長在世間不致於人去法滅才共同結集佛法這個功績當然是非常偉大但這結集時間只有三個月參加結集的人數又只有五百或說千人並且還是偏於摩訶迦葉一系的像這樣匆促的時間和少數人的意見想使所結集的達到滿意的程度當然是不可能它的遺漏與取捨的或有不當也可想而知在結集終了的時候就有人說我等亦欲結集這很可以想見當時情勢的一般了那時的結集不過是一人口中誦出經大眾加以審定並沒有用文字把它寫成定本經過展轉的口傳也就難免漏落錯誤和次序的顛倒不見水潦鶴的公案豈不是大家很熟悉的嗎佛經的正式用文字寫出在阿育王以後所用的文字又有種種的不同彼此的取捨出入可以想像而知何況那時的佛教界早已染上濃厚的宗派色彩為了適合自宗的理論不但經律的字句有增減就是經典的有無甚至連經典組織的形式也全部改觀在這樣的演變下現存的小乘經律能說它完全的代表佛教的原始態嗎能說它概括了釋尊一代的教法嗎大乘經在佛滅三百年後陸續的公開流行像多聞部的分裂就為了接受一分大乘經大乘經典的用文字寫出是和小乘經用文字寫出不相前後的大乘思想有收攝在毘尼中的雜藏中的也有為在家眾說的起初沒有被收入出家眾的公開結集裡只在一人一地中流行的在開始公開流行時有的信仰它有的否認它這只是一部分學者向來沒有傳承學習罷了不能因此說它完全不是佛法不過大乘有後人演繹整理的痕跡其傳出愈後的附會的成分確乎是很大的總之釋尊說法是適應眾生根機的在說明的方便上有千差萬別的不同因之所開顯的意義也就有淺深最初是口口相傳後來才用文字寫成定本釋尊的教法有曾經公開結集的那便是聲聞乘的經律有是傳播於某一區域私相傳授融入學者的整理與發揮到後來才公開流行的那就是雜藏一部分和大乘經因此原始佛教的研究不當偏取小乘在思想上早期的大乘經是一樣的值得尊重第二節原始佛教的根本思想唯識思想的源泉應從阿含經去探索因為四阿含是大小乘共信的公開流行的時期也比較的早雜阿含經是更古典的要從四阿含裡抉出唯識的先驅思想這對於阿含思想的中心有先加認識的必要四阿含所開示的法門好像是很多但自有一貫的核心這便是緣起緣起的定義像經上說此有故彼有此生故彼生此無故彼無此滅故彼滅意思說宇宙人生要皆為關係的存在無獨立的個體因關係的演變分離而消失佛法雖以因緣生總攝一切說明一切但主要的是生命緣起假使離此業果緣起泛談因緣所生還是不能理解佛教真相的整個佛法可以分為流轉還滅兩門還滅流轉都建立在業果緣起的基礎上此有故彼有開示了生死相續的因果法則不息的在三界五趣裡輪轉這就是雜染的流轉此無故彼無是說截斷了生死相續的連繫不再在三界中受生這就是清淨的還滅不但阿含以緣起為中心就是後代龍樹無著諸大論師的教學也不外此事無非解釋發揮這緣起流轉和怎樣證得這緣起的還滅釋尊證悟了生命的實相才從生死大海裡解脫過來因內心悲願的激發想把苦海中的一切眾生都獲得同樣的解放才大轉法輪我們要正確認識佛法的心要那可以從釋尊自悟的聖境中去研究釋尊常常把自己證悟的經歷剴切的說給弟子聽像雜阿含經卷一二二八七經大正藏編號說我憶宿命未成正覺時獨一靜處專精禪思作是念何法有故老死有何法緣故老死有即正思惟生如實無間等生有故老死有生緣故老死有如是有取愛受觸六入處名色何法有故名色有何法緣故名色有即正思惟如實無間等生識有故名色有識緣故名色有我作是思惟時齊識而還不能過彼謂緣識名色緣名色六入處緣六入處觸緣觸受緣受愛緣愛取緣取有緣有生緣生老病死憂悲惱苦如是如是純大苦聚集我時作是念何法無故則老死無何法滅故老死滅即正思惟生如實無間等生無故老死無生滅故老死滅如是生有取愛受觸六入處名色識行廣說我復作是思惟何法無故行無何法滅故行滅即正思惟如實無間等無明無故行無無明滅故行滅行滅故識滅生滅故老病死憂悲惱苦滅如是如是純大苦聚滅我時作是念我得古仙人道古仙人逕古仙人道跡古仙人從此跡去我今隨去譬如有人遊於曠野披荒覓路忽遇故道古人行處彼則隨行漸漸前進見故城邑古王宮殿園觀浴池林木清淨我於此法自知自覺成等正覺釋尊自述他發見生死流轉和解脫生死的法則就是緣起的起滅不但釋尊如此過去諸佛也沒有不經歷這緣起大道的因此緣起是法爾如是的本然而必然的法則不是釋尊創造只是釋尊的平等大慧窺見生命的奧祕而加以說明罷了雜阿含經卷一二二九九經正啟示這個思想緣起法者非我所作亦非餘人作然彼如來出世及未出世法界常住彼如來自覺此法成等正覺為諸眾生分別演說開發顯示釋尊體證了法爾如是的緣起法又給弟子們解說所以從緣起中心的見地考察起來可說整個佛法是緣起法門多方面的善巧說明佛弟子也沒有不從這裡得到悟證或者以為佛說的法門很多像蘊處界諦為什麼偏取緣起作中心呢要知道這些都是在說明緣起的某一部分並不是離開緣起另有建立像五蘊就是緣起名色支的詳細解說眾生於五蘊不知不明無明不斷不離欲愛才流轉在生死裡假使能如實知心厭離欲便能解脫這樣去理解佛說五蘊才有深切的意義六處是以六入支為中心來說明緣起雜阿含經的六入誦詳細的說明內六入六入外六入名色六識識六觸觸六受受六愛愛它在開示緣起支是最明白不過的六入從認識論的見地說明緣起的所以生起和還滅特別注重守護六根在見色聞聲的時候不隨外境而起貪瞋以達到出離生死的目的界有種種的界主要是六界側重在種類與原因的分別他本是緣起法的因緣所攝後代的阿毘達磨六種界緣起也還是連結著的此外像四諦法門的苦集即是緣起的流轉滅與道即是緣起的還滅四諦是染淨因果橫的分類緣起是從流轉還滅而作豎的說明這僅是形式的差別內容還是一致不但阿含經如此大乘經論的精髓也還是以緣起為宗本的法華經的無性從緣起是法住法位般若經的菩薩坐道場時觀十二因緣如虛空不可盡解深密經的以緣起因果為依他起作為染淨迷悟的所依這些大乘經都是以緣起為宗要的大乘論方面也大抵如此特別是龍樹菩薩的開示性空的緣起反覆的讚揚緣起說它是佛法的究竟心要中論的八不頌是如此六十如理論也說為應以何法能斷諸生滅敬禮釋迦尊宣說諸緣起七十空性論也說以諸法性空故佛說諸法皆從因緣起勝義唯如是從三乘聖者的自證方面看從佛陀的言教方面看從大乘論典方面看處處都足以證實緣起是佛法的心要所以我說原始佛教的核心是緣起第三節緣起的解釋第一項緣起支數的考察緣起有十二支是釋尊所開示的這在佛教界早已成為定論近人的原始佛教思想論開始提出不同的意見對校漢文和巴利文的阿含經發現漢譯的大因經與大緣方便經都具足十二支而巴利文本卻只有九支和十支又見經中有齊識而還的話所以說十二支的建立是在佛陀的晚年他又根據大毘婆沙論卷九九的大德說曰彼舍利子隨觀緣起有十二支差別性成阿羅漢的記載假定十二支的完成出於舍利弗之手這樣的推論我是不敢贊同的假定這種推論是正確的那麼更有充實的理由可以證明釋尊最初說法是二支三支五支就是十支也是後起的這當然是不正確的推論與他的最初十支說同樣不能成立要知道緣起主要的意義在說明生命的連繫開示怎樣的逐物流轉怎樣的依著自己所造的業因感受應得的果報至於緣起支數的多少可詳可略可開可合本不妨隨機而有差別的像追述七佛成道所觀的緣起五支十支十二支都編集在阿含經中究竟誰是原始的誰是後人附加的呢又像經上說味著心縛也有五支十支不同的記載這可見釋尊隨機說法的或開或合與成立的先後無關十二支說確乎要比較圓滿所以古代的佛弟子都依這十二支來講說在十二支說普遍流行以後對釋尊詳略開合說法的善巧漸漸的被人忽略了有人不了解這個意義見到經中有九支十支便把它補足成十二支不知這是畫蛇添足至於舍利弗聽阿說示說因緣偈當下證了初果聽了佛和長爪梵志的說法又證了羅漢這在經裡說得很明白怎能影取論師的片文假定緣起的十二支說出於舍利弗之手呢第二項五支說的解說釋尊宣說緣起既有詳略不同那麼要解說緣起當然要注意到支數的多少與含義的廣略才能從比較的研究見到思想的一貫現在為解說上的便利把它歸納作五支三支說十支九支說十二支說三類再去分別的觀察雜阿含經卷一二二八三二八五二八六經等釋尊依愛取有生老病死五支說明逐物流轉與生死相續的連繫這對於因集感苦的緣起觀可說已徹底的發揮了其他的十支說十二支說只是進一步的去探索逐物流轉的理由現在先把每支的定義和前後相互的關係作一簡單的說明老病死憂悲苦惱凡是眾生誰也不能倖免釋尊見到了老病死苦才警覺出家感到老死大患的逼迫想找一種解決的方法這便是釋尊出家的動機之一也是佛家思想的歸宿所在所以用現實的痛苦作為觀察緣起的出發點要解除苦痛須知苦痛的來源這就要追尋老死的原因老死是緣生而有的生是說在魚鳥人天等種種眾生中生既受了生那就必然要老死可是世間眾生雖見到老死的可怕卻都以為生是可喜豈不近視到極點嗎生也有它的原因就是有有一般都解釋做業就是因前生所造的業才會有此生生命的產生但依經文看來還有更主要的解說經上說有是欲有色有無色有三有是能引發三有果報自體的存在因三界趣生自體的存在如種子到了成熟階段就必然有生老病死演變的苦痛這樣有不必把它只看成業因這在經裡還可以得到證據雜阿含經二九一敘述了愛億波提眾生所有種種眾苦的次第三支億波提是取取所繫著的所依名色自體正與有的意義相合再像佛陀初轉法輪說愛取是愛的增長是集諦也沒有明白的別說業力雜阿含經是不大說到業力的這應該怎樣去理解它這不必說業力是後起的是說愛取支不但指內心的煩惱與愛取同時的一切身心活動也包括在內這愛取的身心活動即是未來苦果的業因業力是含攝在愛取支裡眾生為什麼會有三界的自體呢這原因是取取有欲取見取戒禁取我語取四種取是攝受執著追求的意義因為內心執取自我我語取所以在家人執取五欲欲取出家人外道執取種種錯誤的見解見取與無意義的戒禁戒禁取因種種執取的動力而引發身語意的一切行動不論它是貪戀或者厭離這個生命和塵世都要招感未來三有的果報取也有因緣是從愛著而來愛是染著企求的意義有欲愛色愛無色愛三種就是對三有而起的染著這裡我們要加以注意煩惱很多為什麼單說愛呢經中不常說愛結所繫嗎我們起心動念就在自我與認識的境界之間構成了密切的連繫依自我生存的渴愛積極追求塵世的一切或消極的受環境的衝動起貪起瞋甚至不惜生命的毀滅企圖得到一種安息眾生身語意的一切動作沒有不依染著三界自體與塵世為關鍵的眾生生死的動力就在此愛與取是量的差別質的方面是相同的為要表示從愛染到身心種種活動的過程才立這愛取二支長阿含經第一卷的大緣方便經曾對二支有詳細的說明它說阿難當知因愛有求因求有利因利有用因用有欲因欲有著因著有嫉因嫉有守因守有護阿難由有護故有刀杖諍訟作無數惡經文的描寫雖有點過於瑣碎但委曲說明依愛取而起惡心為貪瞋慳吝的根本為一切惡行的動力是非常親切明顯這樣愛緣取取緣有有緣生生緣老病死憂悲苦惱這逐物流轉的緣起觀敢說已經說明了苦集二諦的主要意義第三項十支說的解說一依胎生學為基礎的觸境繫心觀有時釋尊依識緣名色乃至生緣老死的十支說說明緣起十支說的要義是在逐物流轉的基礎上進一步的說明觸境繫心的過程這又可以分為兩類一依胎生學為前提二依認識論為前提第一類像中阿含經第二四卷的大因經經中把六入支含攝在觸支裡名義上只有九支雖趙宋施護異譯的大生義經具足十支但從各方面考察九支是本經原始的真相理由是一長阿含經第一卷的大緣方便經也是佛為阿難說的只要彼此對照一下就可以知道這是一經兩編在大緣方便經裡總標雖有十二支而在一一解說的時候也只有九支二後漢安世高譯的人本欲生經是大因經的異譯也只有九支三大因經的巴利文本也只有九支四有部論典凡是說到大因經的也一律是九支這樣就依九支來解說生死流轉確是依染著生命塵世的渴愛為原因的但愛是心所之一它的生起和活動也不能無因考慮到愛的因緣就發現了受受是心的領納作用有樂受苦受捨受三種在觸對境界而生了別認識的時候在心上現起所知意像的時候必然帶有一種情緒隨順或者違反自己的意樂這或順或違的欣喜憂戚的情緒就叫受這受要依感覺才能引發所以受又依六入觸為緣而生六入觸就是依眼耳鼻舌身意取境的六根而生起眼觸耳觸到意觸這六觸可說是認識作用的開始六入生起覺觸一定要有所觸的對象因此六入觸又以名色為因緣名色的色是色蘊名是受想行識四蘊這五蘊名色可以總攝一切精神與物質名色是六入觸所取的所以是認識的對象緣名色有六入觸緣觸有受緣受有愛的四支說明了觸境繫心的過程名色是認識的對象六入觸是以感覺的機構作關鍵讓客觀的名色反映到六根門頭來六根攝取名色的影像生起主觀的感覺才成為認識這認識因受名色的波動泛起了欣喜憂戚的情緒到這裡因味受著對象被環境的束縛轉移不得自在愛呢因內心苦樂的繫著開始用它主動的姿態對生命塵世而傾向戀慕追逐外境的形勢已像四河入海一樣唯有一直向前奔放不是大力龍王有誰能使它反流呢實際上外境並沒有繫縛內心的力量完全是因內心的味著染愛才自己鎖縛著自己觸境繫心的緣起觀到此可以告一段落進一步觀察名色要從識而有所以說識緣名色但識也還要依託名色才能存在所以又說名色緣識識與名色相依相緣而存在雜阿含經卷一二二八八經曾用束蘆的比喻說明它的相互依存性譬如三蘆立於空地展轉相依而得豎立若去其一二亦不立若去其二一亦不立展轉相依而得豎立識緣名色亦復如是展轉相依而得生長識與名色的相互依存關係不是站在認識論的立場說明有主觀才有客觀有客觀才有主觀依經文看來釋尊的本意是從探索認識活動的根源觸發到生命相依相持而存在的見地名色確乎可以概括內外一切的物質與精神概括認識的一切對象但經中每每用它代表有情身心組織的全體這正和五蘊一樣它能總括一切有為法經中卻又常把它解說為有情組織的要素名色既是有情身心組織的總名當然要追問它從何而來從父精母血的和合漸漸發達到成人其中主要的原因不能不說是識識是初入母胎的識因識的入胎名色才能漸漸的增長廣大起來不但胎兒是這樣就是出胎以後少年到成人假使識一旦離身我們的身心組織立刻要崩潰腐壞這是很明顯的事實所以說名色以識為緣再看這入胎識倘使沒有名色作它的依託識也不能相續存在沒有離開物質的精神也不能從生命的潛流生前死後的生命攔入現實的生命界這不但初入胎是如此就是少年成人也每每因身體的損害使生命無法維持而中夭所以又說名色緣