front:
  text: 題唯識學探源太虛日人先有著唯識思想史者留學僧墨禪曾翻譯而未刊適漢藏教理院講師印順亦有唯識思想史之作先就其半乞余檢定余告以唯識思想史已有成書別命他名為妥聞之因僅述至唯識學未成立前而止余遂為題曰唯識學探源唯識固原本佛言而閱此則知轉輾於部派思想起非一緣流長而源遠矣洵堪為學者探究之一異門方便云民國三十三年十二月序於渝寓自序妙欽與光宗法師願意負責印行本書為本書服務因此取出多年的舊稿從頭校讀一遍拿去校印流通此時而能有此事自然也有一番法喜這是民國二十六年秋天的事了我在武昌讀到了日人結城令聞氏的關於心意識的唯識思想史原題已忘作者的努力使我欽佩然因為見地不同當時就想另寫一部唯識思想史不過病多事大總是拖延又拖延一直沒有落筆二十八年冬天我在縉雲山月耀法師鼓勵我願與我合作代為筆記這才向法尊法師商量稿紙開始我的工作誰知道寫不到四分之一他為了環境所迫不能不暫時去照料油鹽柴米我也鼓起從來未有的勇氣到貴陽去寫作暫時停頓一切是無常的特別是亂離之世動亂是世間的實相這算得什麼夏天我自己繼續寫下去把唯識學的先驅思想寫完把原稿寄呈太虛大師虛公以為唯識思想史已有人譯出預備出版不必再寫下去此文可以自成段落稱為唯識學探源當時我受求真意志的指導開始轉移思想到佛教的另一角所以就此結束我沒有貫徹初衷有願未了總不免抱歉似的好在關於大乘唯識的思想我在印度之佛教第十四十五章攝大乘論講記等已陸續有過簡略的提示了我想寫唯識思想史倒不是為了與人諍辯反而是覺得唯識學者的爭辯噪聒得討厭了我自己從前就是一個針對唯識學界的諍論預備作一番清理工作讓大家了解自己了解對方一笑而罷在印度大乘佛教的開展中唯心論有真心派與妄心派二大流傳到中國來即有地論師攝論師唯識師三派此兩大流真心派從印度東方南的大眾分別說系發展而來妄心派從印度西方北的說一切有系中出來在長期的離合發展中彼此關涉得很深然兩大體系的不同到底存在大體的說妄心派重於論典如無著世親等的著作重思辨重分析重事相重認識論以虛妄心為染淨的所依清淨法是附屬的真心派重於經典都編集為經典的體裁重直覺重綜合重理性重本體論以真常心為染淨的所依雜染是外鑠的經典總是時代的先進者西方的論師們承受它思想的啟發給予嚴密的思辨化又多少要修正它這種東西印度的風格不同不僅是第三期的唯心佛教就是前二期的佛教也有此種情形甚至在婆羅門教中也還是有此東西兩大陣容的這種區域文化的特色本平常明白但傳統的唯識學者不大理會這些他們的意見是我所學所弘揚的論典或者經典是究竟的唯心非如此不可這才是佛說這樣諍論當然不免本來承受某一思想對於另一思想即不能無所取捨真理愈辨愈明辯論不一定是壞的所以真心論可以批評妄心論妄心論可以反對真心論不過作為反對與批評的標準何在這不外理證與教證理證各有思想體系加上自宗規定了的了義不了義如離開事實的證明那種筆墨與口頭官司千百年來還沒有斷案現在再覆述一遍也不過多一番熱鬧而已說到教證真心論已融化於唯心的大乘經中妄心者承認大乘經是佛說即沒有資格去動搖真心論妄心論的根本論是未來佛彌勒說加上嚴密的思辨真心者也無力摧毀他以我的理解真心論的盧舍那佛說迦旃延佛說妄心論的彌勒佛說都不過繼承根本佛教的思想在不同的時代區域中經古人長期的體驗思辨而編集的成果承認此兩大思想的分流自然是互相影響的同等的地位從時代的前後去整理它經與論間經與經論與論的中間看出它的演變分化從演變分化中把握它的共同性這才是公平而又不籠統的辦法研究它的思想來源考察它的思想方法何以說真何以要說妄為什麼要說唯心是否非唯心不可從高一層的根本佛教去觀察自然能給予正確的評價這樣我不能不感到結城令聞的大作美中不足不夠了解唯識的思想了本書是預擬唯識思想史的上編把序說刪去讓它自成段落作者的意見或者有點不易明瞭即如最後的無境論探源也不免簡陋無境即唯識家的空義真心與妄心說空不同而且空義的闡發從根本聖典到前二期佛教多方面的關涉比細心說與種子說要複雜得多預備另作專題去考察它所以這裡只略為一提附記本書為民國三十三年在四川初版流通後由上海大法輪書局再版今以重行排印略為修正民國五十九年一月印順記
